<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <link href="/images/c88292ed9_logo.png" rel="icon" type="image/png"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Meal Plan | ALEFIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@700;800;900&display=swap" rel="stylesheet"/>
  <script>
  (function(){
    var t = localStorage.getItem('base44_access_token') || localStorage.getItem('token');
    if (!t) {
      window.location.replace('/Login.html?from_url=' + encodeURIComponent(window.location.href));
    }
  })();
  </script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--lime:#D4FF00;--bg:#0F0F0F;--surface:#141414;--border:#1f1f1f;--text:#fff;--muted:rgba(255,255,255,0.4)}
    body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
    a{color:inherit;text-decoration:none}

    /* NAV */
    nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:1.25rem 2rem;display:flex;align-items:center;justify-content:space-between;background:rgba(15,15,15,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
    .nav-logo{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:900;letter-spacing:0.05em}
    .nav-logo span{color:var(--lime)}
    .nav-links{display:flex;align-items:center;gap:2rem}
    .nav-links a{font-size:0.75rem;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);transition:color 0.2s}
    .nav-links a:hover,.nav-links a.active{color:var(--lime)}
    .nav-links .btn-signup{background:var(--lime);color:#000;padding:0.5rem 1.25rem;font-size:0.75rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase}

    /* LOADING */
    #loading{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1rem}
    .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--lime);border-radius:50%;animation:spin 0.8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* QUIZ */
    #quiz-view{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6rem 1.5rem 3rem}
    .quiz-card{width:100%;max-width:560px}
    .quiz-label{color:var(--lime);font-size:0.7rem;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem}
    .quiz-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2rem,6vw,3.5rem);font-weight:900;line-height:1;margin-bottom:2.5rem;letter-spacing:-0.01em}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
    @media(max-width:480px){.form-grid{grid-template-columns:1fr}}
    .form-group{display:flex;flex-direction:column;gap:0.4rem}
    .form-group.full{grid-column:1/-1}
    label{font-size:0.7rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted)}
    select,input[type=text]{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:0.7rem 0.875rem;font-size:0.875rem;font-family:inherit;outline:none;width:100%;transition:border-color 0.2s;border-radius:2px}
    select:focus,input[type=text]:focus{border-color:var(--lime)}
    select option{background:var(--surface)}
    .btn-generate{width:100%;background:var(--lime);color:#000;border:none;padding:1rem;font-size:0.875rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;margin-top:1.5rem;transition:opacity 0.2s}
    .btn-generate:hover{opacity:0.9}
    .btn-generate:disabled{opacity:0.4;cursor:not-allowed}

    /* GENERATING */
    #generating-view{min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.5rem;padding:6rem 1.5rem}
    .gen-icon{font-size:3rem;animation:pulse 1.5s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:0.7}}
    .gen-title{font-family:'Barlow Condensed',sans-serif;font-size:2rem;font-weight:900;letter-spacing:-0.01em}
    .gen-subtitle{color:var(--muted);font-size:0.875rem}

    /* PLAN VIEW */
    #plan-view{padding:6rem 1.5rem 4rem}
    .plan-container{max-width:900px;margin:0 auto}
    .plan-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2.5rem;gap:1rem;flex-wrap:wrap}
    .plan-label{color:var(--lime);font-size:0.7rem;font-weight:700;letter-spacing:0.3em;text-transform:uppercase}
    .plan-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(2rem,6vw,3.5rem);font-weight:900;line-height:1;letter-spacing:-0.01em}
    .btn-regen{background:transparent;border:1px solid var(--border);color:var(--muted);padding:0.5rem 1rem;font-size:0.7rem;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;cursor:pointer;transition:all 0.2s;font-family:inherit}
    .btn-regen:hover{border-color:var(--lime);color:var(--lime)}

    /* DAY TABS */
    .day-tabs{display:flex;gap:0.5rem;margin-bottom:2rem;overflow-x:auto;padding-bottom:0.25rem;scrollbar-width:none}
    .day-tabs::-webkit-scrollbar{display:none}
    .day-tab{flex-shrink:0;padding:0.5rem 1rem;font-size:0.7rem;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:transparent;transition:all 0.2s;font-family:inherit}
    .day-tab.active{background:var(--lime);color:#000;border-color:var(--lime)}
    .day-tab:hover:not(.active){border-color:rgba(255,255,255,0.2);color:var(--text)}

    /* MEAL CARDS */
    .meals-grid{display:grid;gap:1rem}
    .meal-card{background:var(--surface);border:1px solid var(--border);padding:1.5rem;transition:border-color 0.2s}
    .meal-card:hover{border-color:rgba(212,255,0,0.2)}
    .meal-type{font-size:0.65rem;font-weight:700;letter-spacing:0.25em;text-transform:uppercase;color:var(--lime);margin-bottom:0.5rem}
    .meal-name{font-family:'Barlow Condensed',sans-serif;font-size:1.5rem;font-weight:700;margin-bottom:0.75rem;letter-spacing:0.01em}
    .meal-meta{display:flex;align-items:center;gap:1.5rem;margin-bottom:1rem;flex-wrap:wrap}
    .meal-cal{font-size:1.125rem;font-weight:700;color:var(--lime)}
    .meal-cal span{font-size:0.7rem;font-weight:500;color:var(--muted);margin-left:0.2rem}
    .macro-pills{display:flex;gap:0.5rem;flex-wrap:wrap}
    .macro-pill{background:rgba(255,255,255,0.05);border:1px solid var(--border);padding:0.25rem 0.625rem;font-size:0.7rem;font-weight:600;letter-spacing:0.05em}
    .meal-details{display:none}
    .meal-card.open .meal-details{display:block}
    .details-cols{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1rem}
    @media(max-width:500px){.details-cols{grid-template-columns:1fr}}
    .detail-section h4{font-size:0.65rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:0.625rem}
    .detail-section ul{list-style:none;display:flex;flex-direction:column;gap:0.375rem}
    .detail-section li{font-size:0.8rem;color:rgba(255,255,255,0.7);padding-left:0.875rem;position:relative}
    .detail-section li::before{content:'—';position:absolute;left:0;color:var(--lime);font-size:0.7rem}
    .toggle-details{background:transparent;border:none;color:var(--muted);font-size:0.7rem;font-weight:600;letter-spacing:0.15em;text-transform:uppercase;cursor:pointer;padding:0;margin-top:0.75rem;font-family:inherit;transition:color 0.2s}
    .toggle-details:hover{color:var(--lime)}

    /* HIDDEN */
    .hidden{display:none!important}
  </style>
</head>
<body>

<nav>
  <a href="/"><img src="/images/alefit-logo.png" alt="AleFit" style="height:36px;width:auto"></a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/#programs">Programs</a>
    <a href="/meal-plan" class="active">Meal Plan</a>
    <a href="/calorie-tracker">Calories</a>
    <a id="nav-account" href="/Login.html">Login</a>
    <a href="/Register.html" class="btn-signup">Sign Up</a>
  </div>
</nav>

<!-- Loading -->
<div id="loading">
  <div class="spinner"></div>
  <p style="color:var(--muted);font-size:0.8rem;letter-spacing:0.15em;text-transform:uppercase">Loading your plan…</p>
</div>

<!-- Quiz (new plan) -->
<div id="quiz-view" class="hidden">
  <div class="quiz-card">
    <div class="quiz-label">🥗 Meal Plan Generator</div>
    <h1 class="quiz-title">BUILD YOUR<br/>MEAL PLAN</h1>
    <div class="form-grid">
      <div class="form-group">
        <label for="q-goal">Goal</label>
        <select id="q-goal">
          <option>Gain Muscle</option>
          <option>Lose Weight</option>
          <option>Maintain Weight</option>
          <option>Improve Performance</option>
        </select>
      </div>
      <div class="form-group">
        <label for="q-activity">Activity Level</label>
        <select id="q-activity">
          <option>Moderately Active (3–5x/wk)</option>
          <option>Sedentary</option>
          <option>Lightly Active (1–3x/wk)</option>
          <option>Very Active (6–7x/wk)</option>
        </select>
      </div>
      <div class="form-group">
        <label for="q-diet">Dietary Preference</label>
        <select id="q-diet">
          <option>Standard</option>
          <option>High Protein</option>
          <option>Vegetarian</option>
          <option>Vegan</option>
          <option>Keto</option>
          <option>Paleo</option>
          <option>Mediterranean</option>
        </select>
      </div>
      <div class="form-group">
        <label for="q-meals">Meals Per Day</label>
        <select id="q-meals">
          <option value="4">4 meals</option>
          <option value="3">3 meals</option>
          <option value="5">5 meals</option>
        </select>
      </div>
      <div class="form-group full">
        <label for="q-allergies">Allergies / Restrictions</label>
        <input type="text" id="q-allergies" placeholder="e.g. nuts, gluten — or leave blank"/>
      </div>
    </div>
    <div id="quiz-error" style="color:#ff5555;font-size:0.8rem;margin-top:0.75rem;display:none"></div>
    <button class="btn-generate" id="btn-generate" onclick="generatePlan()">Generate My 7-Day Plan</button>
  </div>
</div>

<!-- Generating -->
<div id="generating-view" class="hidden">
  <div class="gen-icon">🥗</div>
  <div class="gen-title">BUILDING YOUR PLAN</div>
  <div class="gen-subtitle">Personalising meals for your goals…</div>
</div>

<!-- Plan view -->
<div id="plan-view" class="hidden">
  <div class="plan-container">
    <div class="plan-header">
      <div>
        <div class="plan-label">Your Weekly Plan</div>
        <div class="plan-title" id="plan-title">7-DAY<br/>MEAL PLAN</div>
      </div>
      <button class="btn-regen" onclick="showQuiz()">↻ Generate New Plan</button>
    </div>
    <div class="day-tabs" id="day-tabs"></div>
    <div class="meals-grid" id="meals-grid"></div>
  </div>
</div>

<script>
const APP_ID = '6a1f3d189ebdbe71fa7d256c';
const DAYS = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];

function getToken() {
  return localStorage.getItem('base44_access_token') || localStorage.getItem('token') || '';
}

function authHeaders() {
  const t = getToken();
  return t ? {'Authorization': 'Bearer ' + t, 'Content-Type': 'application/json'} : {'Content-Type': 'application/json'};
}

function show(id) {
  ['loading','quiz-view','generating-view','plan-view'].forEach(function(v) {
    document.getElementById(v).classList.toggle('hidden', v !== id);
  });
}

// Update nav account link
(function() {
  const t = getToken();
  const el = document.getElementById('nav-account');
  if (t) { el.textContent = 'My Account'; el.href = '/Account.html'; }
})();

// On load: try to fetch latest saved plan
window.addEventListener('DOMContentLoaded', async function() {
  const token = getToken();
  if (!token) { show('quiz-view'); restoreQuizAnswers(); return; }

  try {
    const res = await fetch('/api/apps/' + APP_ID + '/entities/MealPlan?limit=1', {
      headers: authHeaders()
    });
    if (!res.ok) throw new Error('no plan');
    const data = await res.json();
    const items = data.items || data;
    if (Array.isArray(items) && items.length > 0) {
      const entity = items[0];
      const planData = entity.data || entity;
      const plan = planData.plan || planData;
      // Validate it has day keys
      if (plan && plan.Monday) {
        renderPlan(plan);
        return;
      }
    }
    show('quiz-view');
    restoreQuizAnswers();
  } catch(e) {
    show('quiz-view');
    restoreQuizAnswers();
  }
});

function restoreQuizAnswers() {
  try {
    const saved = JSON.parse(localStorage.getItem('alefit_mp_quiz') || '{}');
    if (saved.goal) document.getElementById('q-goal').value = saved.goal;
    if (saved.diet) document.getElementById('q-diet').value = saved.diet;
    if (saved.activity) document.getElementById('q-activity').value = saved.activity;
    if (saved.meals) document.getElementById('q-meals').value = saved.meals;
    if (saved.allergies) document.getElementById('q-allergies').value = saved.allergies;
  } catch(e) {}
}

function saveQuizAnswers() {
  const answers = {
    goal: document.getElementById('q-goal').value,
    activity: document.getElementById('q-activity').value,
    diet: document.getElementById('q-diet').value,
    meals: document.getElementById('q-meals').value,
    allergies: document.getElementById('q-allergies').value
  };
  localStorage.setItem('alefit_mp_quiz', JSON.stringify(answers));
  return answers;
}

function showQuiz() {
  show('quiz-view');
  restoreQuizAnswers();
}

async function generatePlan() {
  const btn = document.getElementById('btn-generate');
  const errEl = document.getElementById('quiz-error');
  errEl.style.display = 'none';

  const token = getToken();
  if (!token) {
    errEl.textContent = 'Please log in to generate and save your meal plan.';
    errEl.style.display = 'block';
    return;
  }

  const answers = saveQuizAnswers();
  btn.disabled = true;
  show('generating-view');

  const prompt = 'Create a detailed 7-day meal plan for someone with these preferences:\n' +
    '- Goal: ' + answers.goal + '\n' +
    '- Activity level: ' + answers.activity + '\n' +
    '- Dietary preference: ' + answers.diet + '\n' +
    '- Meal frequency: ' + answers.meals + ' meals per day\n' +
    '- Food allergies: ' + (answers.allergies || 'None') + '\n\n' +
    'Respond with ONLY a valid JSON object — no markdown, no explanation, just raw JSON.\n' +
    'The object must have exactly these keys: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday.\n' +
    'Each day is an array of meal objects. Each meal must have: type, name, calories (number), macros ({protein,carbs,fat} as strings with g), ingredients (array), steps (array).';

  try {
    const res = await fetch('/api/apps/' + APP_ID + '/integration-endpoints/Core/InvokeLLM', {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({ prompt: prompt })
    });
    const plan = await res.json();
    if (!res.ok || plan.error) throw new Error(plan.error || 'Generation failed');
    renderPlan(plan);
  } catch(e) {
    btn.disabled = false;
    show('quiz-view');
    errEl.textContent = 'Generation failed: ' + (e.message || 'Please try again.');
    errEl.style.display = 'block';
  }
}

let currentDay = 'Monday';
let currentPlan = null;

function renderPlan(plan) {
  currentPlan = plan;
  // Build day tabs
  const tabs = document.getElementById('day-tabs');
  tabs.innerHTML = '';
  DAYS.forEach(function(day) {
    if (!plan[day]) return;
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (day === 'Monday' ? ' active' : '');
    btn.textContent = day.slice(0,3).toUpperCase();
    btn.onclick = function() { selectDay(day); };
    btn.dataset.day = day;
    tabs.appendChild(btn);
  });
  selectDay('Monday');
  show('plan-view');
}

function selectDay(day) {
  currentDay = day;
  document.querySelectorAll('.day-tab').forEach(function(b) {
    b.classList.toggle('active', b.dataset.day === day);
  });
  renderMeals(currentPlan[day] || []);
}

function renderMeals(meals) {
  const grid = document.getElementById('meals-grid');
  grid.innerHTML = '';
  meals.forEach(function(meal, idx) {
    const card = document.createElement('div');
    card.className = 'meal-card';
    card.innerHTML =
      '<div class="meal-type">' + escHtml(meal.type || '') + '</div>' +
      '<div class="meal-name">' + escHtml(meal.name || '') + '</div>' +
      '<div class="meal-meta">' +
        '<div class="meal-cal">' + (meal.calories || '—') + '<span>kcal</span></div>' +
        '<div class="macro-pills">' + macroHtml(meal.macros) + '</div>' +
      '</div>' +
      '<button class="toggle-details" onclick="toggleDetails(this)">+ Ingredients & Steps</button>' +
      '<div class="meal-details">' +
        '<div class="details-cols">' +
          '<div class="detail-section">' +
            '<h4>Ingredients</h4>' +
            '<ul>' + listHtml(meal.ingredients) + '</ul>' +
          '</div>' +
          '<div class="detail-section">' +
            '<h4>Preparation</h4>' +
            '<ul>' + listHtml(meal.steps) + '</ul>' +
          '</div>' +
        '</div>' +
      '</div>';
    grid.appendChild(card);
  });
}

function toggleDetails(btn) {
  const card = btn.closest('.meal-card');
  const open = card.classList.toggle('open');
  btn.textContent = open ? '− Close' : '+ Ingredients & Steps';
}

function macroHtml(macros) {
  if (!macros) return '';
  return ['protein','carbs','fat'].map(function(k) {
    var v = macros[k] || '—';
    return '<span class="macro-pill">' + k[0].toUpperCase() + k.slice(1) + ': ' + escHtml(String(v)) + '</span>';
  }).join('');
}

function listHtml(arr) {
  if (!Array.isArray(arr)) return '';
  return arr.map(function(item) { return '<li>' + escHtml(String(item)) + '</li>'; }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
