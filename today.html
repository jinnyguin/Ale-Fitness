<!doctype html>
<html lang="en">
<head>
  <script src="/auth-session.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Today | ALEFIT</title>
  <link rel="icon" href="/images/alefit-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app-shell.css">
  <link rel="stylesheet" href="/today-dashboard.css">
</head>
<body>
  <div class="app-frame">
    <header class="app-header">
      <a class="brand" href="/today.html" aria-label="ALEFIT Today"><img src="/images/alefit-logo.png" alt="ALEFIT"></a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <a data-view="today" href="/today.html">Today</a>
        <a data-view="plan" href="/today.html?view=plan">My Plan</a>
        <a data-view="progress" href="/today.html?view=progress">Progress</a>
        <a data-view="coach" href="/today.html?view=coach">Coach</a>
        <a data-view="profile" href="/today.html?view=profile">Profile</a>
      </nav>
      <div class="header-right"><span id="header-name" class="header-name"></span><a class="avatar" id="header-avatar" href="/today.html?view=profile" aria-label="Open profile">A</a></div>
    </header>
    <main class="app-main" id="app" aria-live="polite">
      <section class="coach-loading" role="status" aria-live="polite">
        <div class="coach-loading-mark" aria-hidden="true">
          <span class="coach-loading-core"><img src="/images/alefit-logo.png" alt=""></span>
        </div>
        <p class="coach-loading-eyebrow">Your coaching space</p>
        <h1>Getting your next session ready</h1>
        <p class="coach-loading-copy">Bringing your training plan and recent progress together.</p>
        <div class="coach-loading-card" aria-hidden="true">
          <div class="coach-loading-card-top">
            <span class="coach-loading-card-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12h3l2-7 4 14 3-10 2 3h4"/>
              </svg>
            </span>
            <div class="coach-loading-lines">
              <span class="coach-loading-line"></span>
              <span class="coach-loading-line short"></span>
            </div>
          </div>
          <div class="coach-loading-divider"></div>
          <div class="coach-loading-bars">
            <span class="coach-loading-bar"></span>
            <span class="coach-loading-bar"></span>
            <span class="coach-loading-bar"></span>
          </div>
        </div>
        <p class="coach-loading-note"><span class="coach-loading-pulse" aria-hidden="true"></span>Preparing your plan</p>
      </section>
    </main>
    <nav class="mobile-nav" aria-label="Mobile navigation">
      <a data-view="today" href="/today.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg>Today</a>
      <a data-view="plan" href="/today.html?view=plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 3h6v4H9zM9 12h6M9 16h6"/></svg>Plan</a>
      <a data-view="progress" href="/today.html?view=progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V12h4v8m2 0V8h4v12m2 0V3h4v17M3 21h18"/></svg>Progress</a>
      <a data-view="coach" href="/today.html?view=coach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H9l-5 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3zM8 8h8M8 12h5"/></svg>Coach</a>
      <a data-view="profile" href="/today.html?view=profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg>Profile</a>
    </nav>
  </div>
  <script src="/training-engine.js"></script>
  <script src="/analytics.js"></script>
  <script src="/today.js"></script>
</body>
</html>
