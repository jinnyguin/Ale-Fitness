<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Account | ALEFIT</title>
  <link rel="icon" href="/images/c88292ed9_logo.png" type="image/png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #000; min-height: 100vh; color: #fff; padding: 2rem 1rem; }
    .container { max-width: 560px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 0.4rem; color: #444; font-size: 0.875rem; text-decoration: none; margin-bottom: 2rem; transition: color 0.15s; }
    .back-link:hover { color: #aaa; }
    .card { background: #0f0f0f; border: 1px solid #1f1f1f; border-radius: 1rem; padding: 2rem; margin-bottom: 1.25rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
    .card-title { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #444; margin-bottom: 1.25rem; }
    .profile-header { display: flex; align-items: center; gap: 1.25rem; margin-bottom: 2rem; }
    .avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #4ade80, #16a34a); display: flex; align-items: center; justify-content: center; font-size: 1.75rem; font-weight: 800; color: #000; flex-shrink: 0; }
    .profile-info h2 { font-size: 1.25rem; font-weight: 700; }
    .profile-info p { color: #555; font-size: 0.875rem; margin-top: 0.25rem; }
    .badge { display: inline-block; background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.25); color: #4ade80; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; padding: 0.2rem 0.6rem; border-radius: 9999px; margin-top: 0.4rem; text-transform: uppercase; }
    label { display: block; color: #555; font-size: 0.8125rem; font-weight: 500; margin-bottom: 0.375rem; }
    .field { margin-bottom: 1rem; }
    input[type=text], input[type=email], input[type=password] { width: 100%; background: #0a0a0a; border: 1px solid #1f1f1f; border-radius: 0.5rem; padding: 0.625rem 0.875rem; color: #fff; font-size: 0.9375rem; outline: none; transition: border-color 0.15s; }
    input:focus { border-color: #4ade80; }
    input[readonly] { opacity: 0.4; cursor: not-allowed; }
    .btn { background: #4ade80; color: #000; border: none; border-radius: 0.5rem; padding: 0.625rem 1.25rem; font-size: 0.875rem; font-weight: 800; cursor: pointer; transition: opacity 0.15s; letter-spacing: 0.02em; }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .btn-outline { background: transparent; color: #555; border: 1px solid #1f1f1f; border-radius: 0.5rem; padding: 0.625rem 1.25rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: border-color 0.15s, color 0.15s; }
    .btn-outline:hover { border-color: #333; color: #aaa; }
    .btn-danger { background: transparent; color: #f87171; border: 1px solid #3f0000; border-radius: 0.5rem; padding: 0.625rem 1.25rem; font-size: 0.875rem; font-weight: 500; cursor: pointer; transition: background 0.15s; }
    .btn-danger:hover { background: #1a0000; }
    .msg { font-size: 0.8125rem; padding: 0.625rem 0.875rem; border-radius: 0.5rem; margin-top: 0.75rem; display: none; }
    .msg-ok { background: rgba(74,222,128,0.08); border: 1px solid rgba(74,222,128,0.2); color: #4ade80; }
    .msg-err { background: #1a0000; border: 1px solid #7f1d1d; color: #fca5a5; }
    .stat-row { display: flex; justify-content: space-between; padding: 0.625rem 0; border-bottom: 1px solid #111; font-size: 0.875rem; }
    .stat-row:last-child { border-bottom: none; }
    .stat-key { color: #444; }
    .stat-val { color: #ddd; font-weight: 500; }
  </style>
</head>
<body>
<div class="container">
  <a href="/" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back to home
  </a>

  <div class="card">
    <div class="profile-header">
      <div class="avatar" id="avatarEl">?</div>
      <div class="profile-info">
        <h2 id="displayName">Loading…</h2>
        <p id="displayEmail">—</p>
        <span class="badge">Member</span>
      </div>
    </div>
    <p class="card-title">Display Name</p>
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="fullNameInput" placeholder="Your name" autocomplete="name"/>
    </div>
    <button class="btn" id="saveName" onclick="saveNameFn()">Save Name</button>
    <div class="msg msg-ok" id="nameOk">Name updated!</div>
    <div class="msg msg-err" id="nameErr"></div>
  </div>

  <div class="card">
    <p class="card-title">Account Info</p>
    <div class="stat-row"><span class="stat-key">Email</span><span class="stat-val" id="infoEmail">—</span></div>
    <div class="stat-row"><span class="stat-key">Account ID</span><span class="stat-val" id="infoId" style="font-size:0.75rem;font-family:monospace">—</span></div>
    <div class="stat-row"><span class="stat-key">Member since</span><span class="stat-val" id="infoJoined">—</span></div>
  </div>

  <div class="card">
    <p class="card-title">Change Password</p>
    <div class="field">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" autocomplete="new-password"/>
    </div>
    <div class="field">
      <label>Confirm New Password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password"/>
    </div>
    <button class="btn" onclick="changePasswordFn()">Update Password</button>
    <div class="msg msg-ok" id="pwOk">Password updated successfully!</div>
    <div class="msg msg-err" id="pwErr"></div>
  </div>

  <div class="card">
    <p class="card-title">Session</p>
    <button class="btn-danger" onclick="logoutFn()">Sign Out</button>
  </div>
</div>
<script>
(function() {
  var APP_ID = '6a1f3d189ebdbe71fa7d256c';
  var token = localStorage.getItem('base44_access_token') || localStorage.getItem('token');
  var currentUser = null;
  if (!token) { window.location.replace('/Login.html?from_url=' + encodeURIComponent(window.location.href)); return; }
  function initials(name) {
    if (!name) return '?';
    var p = name.trim().split(/\s+/);
    return p.length >= 2 ? (p[0][0]+p[p.length-1][0]).toUpperCase() : p[0].substring(0,2).toUpperCase();
  }
  function loadUser() {
    fetch('/api/apps/'+APP_ID+'/auth/me', {headers:{'Authorization':'Bearer '+token}})
    .then(function(r) {
      if (r.status===401) { localStorage.removeItem('base44_access_token'); localStorage.removeItem('token'); window.location.replace('/Login.html'); return; }
      return r.json();
    }).then(function(user) {
      if (!user) return;
      currentUser = user;
      localStorage.setItem('alefit_user', JSON.stringify(user));
      var name = user.full_name||'', email = user.email||'';
      var joined = user.created_date ? new Date(user.created_date).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : '—';
      document.getElementById('avatarEl').textContent = initials(name||email);
      document.getElementById('displayName').textContent = name||email||'ALEFIT Member';
      document.getElementById('displayEmail').textContent = email;
      document.getElementById('fullNameInput').value = name;
      document.getElementById('infoEmail').textContent = email;
      document.getElementById('infoId').textContent = user.id||'—';
      document.getElementById('infoJoined').textContent = joined;
    }).catch(function() { document.getElementById('displayName').textContent = 'Error loading profile'; });
  }
  window.saveNameFn = function() {
    var name = document.getElementById('fullNameInput').value.trim();
    if (!name) return;
    var btn = document.getElementById('saveName');
    btn.disabled = true; btn.textContent = 'Saving…';
    hide(['nameOk','nameErr']);
    fetch('/api/apps/'+APP_ID+'/auth/me',{method:'PUT',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({full_name:name})})
    .then(function(r){return r.json();}).then(function(data){
      btn.disabled = false; btn.textContent = 'Save Name';
      if (data.id||data.full_name!==undefined) {
        show('nameOk');
        document.getElementById('avatarEl').textContent = initials(name);
        document.getElementById('displayName').textContent = name;
        if (currentUser) { currentUser.full_name=name; localStorage.setItem('alefit_user',JSON.stringify(currentUser)); }
      } else { showErr('nameErr', data.error||'Could not update name.'); }
    }).catch(function(){ btn.disabled=false; btn.textContent='Save Name'; showErr('nameErr','Network error.'); });
  };
  window.changePasswordFn = function() {
    var pw = document.getElementById('newPassword').value;
    var pw2 = document.getElementById('confirmPassword').value;
    hide(['pwOk','pwErr']);
    if (pw.length<8) { showErr('pwErr','Password must be at least 8 characters.'); return; }
    if (pw!==pw2) { showErr('pwErr','Passwords do not match.'); return; }
    fetch('/api/apps/'+APP_ID+'/auth/change-password',{method:'POST',headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({new_password:pw})})
    .then(function(r){return r.json();}).then(function(data){
      if (data.message) { show('pwOk'); document.getElementById('newPassword').value=''; document.getElementById('confirmPassword').value=''; }
      else showErr('pwErr',data.error||'Could not change password.');
    }).catch(function(){ showErr('pwErr','Network error.'); });
  };
  window.logoutFn = function() {
    localStorage.removeItem('base44_access_token'); localStorage.removeItem('token'); localStorage.removeItem('alefit_user');
    window.location.replace('/');
  };
  function show(id) { document.getElementById(id).style.display='block'; }
  function hide(ids) { ids.forEach(function(id){ document.getElementById(id).style.display='none'; }); }
  function showErr(id,msg) { var el=document.getElementById(id); el.textContent=msg; el.style.display='block'; }
  loadUser();
})();
</script>
</body>
</html>
