<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Account | ALEFIT</title>
  <link rel="icon" href="/images/c88292ed9_logo.png" type="image/png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; background: #0f0f0f; min-height: 100vh; color: #fff; }
    .topbar {
      background: #0f0f0f; border-bottom: 1px solid #1a1a1a;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.5rem; position: sticky; top: 0; z-index: 10;
    }
    .topbar-logo { font-size: 1.25rem; font-weight: 900; letter-spacing: 0.08em; color: #fff; text-decoration: none; }
    .topbar-logo span { color: #D4FF00; }
    .topbar-back { color: #555; font-size: 0.8125rem; text-decoration: none; display: flex; align-items: center; gap: 0.4rem; transition: color 0.15s; }
    .topbar-back:hover { color: #aaa; }
    .page { max-width: 640px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .page-title { font-size: 1.5rem; font-weight: 900; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2rem; }
    .page-title span { color: #D4FF00; }

    /* Profile header */
    .profile-hero {
      background: #111; border: 1px solid #1f1f1f; border-radius: 0.75rem;
      padding: 2rem; margin-bottom: 1.25rem; display: flex; align-items: flex-start; gap: 1.5rem;
    }
    .avatar-wrap { position: relative; flex-shrink: 0; cursor: pointer; }
    .avatar {
      width: 88px; height: 88px; border-radius: 50%; object-fit: cover;
      background: #1a1a1a; border: 2px solid #2a2a2a;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem; font-weight: 800; color: #D4FF00;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .avatar-overlay {
      position: absolute; inset: 0; border-radius: 50%;
      background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.2s; cursor: pointer;
    }
    .avatar-wrap:hover .avatar-overlay { opacity: 1; }
    .avatar-overlay svg { color: #D4FF00; }
    #avatarInput { display: none; }
    .profile-info { flex: 1; min-width: 0; }
    .profile-name { font-size: 1.375rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .profile-email { color: #555; font-size: 0.875rem; margin-top: 0.25rem; }
    .profile-badge {
      display: inline-flex; align-items: center; gap: 0.35rem; margin-top: 0.6rem;
      background: rgba(212,255,0,0.08); border: 1px solid rgba(212,255,0,0.2);
      color: #D4FF00; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em;
      padding: 0.25rem 0.625rem; border-radius: 9999px; text-transform: uppercase;
    }
    .upload-hint { color: #444; font-size: 0.75rem; margin-top: 0.5rem; }

    /* Cards */
    .card { background: #111; border: 1px solid #1f1f1f; border-radius: 0.75rem; padding: 1.5rem; margin-bottom: 1.25rem; }
    .card-label {
      font-size: 0.7rem; font-weight: 700; color: #444; letter-spacing: 0.1em;
      text-transform: uppercase; margin-bottom: 1.25rem; display: flex; align-items: center; gap: 0.5rem;
    }
    .card-label::after { content: ''; flex: 1; border-top: 1px solid #1a1a1a; }
    label { display: block; color: #555; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.375rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .field { margin-bottom: 1rem; }
    input[type=text], input[type=email], input[type=password], input[type=number], textarea {
      width: 100%; background: #0a0a0a; border: 1px solid #222; border-radius: 0.375rem;
      padding: 0.6875rem 0.875rem; color: #fff; font-size: 0.9375rem; outline: none;
      transition: border-color 0.15s; font-family: inherit;
    }
    textarea { resize: vertical; min-height: 80px; }
    input:focus, textarea:focus { border-color: #D4FF00; }
    input::placeholder, textarea::placeholder { color: #333; }
    input[readonly] { opacity: 0.35; cursor: not-allowed; }
    .cal-row { display: flex; gap: 0.75rem; align-items: center; }
    .cal-row input { flex: 1; }
    .cal-unit { color: #555; font-size: 0.875rem; white-space: nowrap; }
    .btn {
      background: #D4FF00; color: #000; border: none; border-radius: 0.375rem;
      padding: 0.6875rem 1.5rem; font-size: 0.875rem; font-weight: 800; cursor: pointer;
      transition: opacity 0.15s; letter-spacing: 0.05em; text-transform: uppercase;
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-ghost {
      background: transparent; color: #555; border: 1px solid #222; border-radius: 0.375rem;
      padding: 0.6875rem 1.5rem; font-size: 0.875rem; font-weight: 600; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .btn-ghost:hover { border-color: #333; color: #aaa; }
    .btn-danger {
      background: transparent; color: #f87171; border: 1px solid #3f0000; border-radius: 0.375rem;
      padding: 0.6875rem 1.5rem; font-size: 0.875rem; font-weight: 600; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-danger:hover { background: rgba(220,38,38,0.08); }
    .btn-row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; margin-top: 0.25rem; }
    .msg { font-size: 0.8125rem; padding: 0.625rem 0.875rem; border-radius: 0.375rem; display: none; }
    .msg-ok { background: rgba(212,255,0,0.06); border: 1px solid rgba(212,255,0,0.2); color: #D4FF00; }
    .msg-err { background: rgba(220,38,38,0.06); border: 1px solid rgba(220,38,38,0.3); color: #fca5a5; }
    .stat-row { display: flex; justify-content: space-between; padding: 0.625rem 0; border-bottom: 1px solid #161616; font-size: 0.875rem; }
    .stat-row:last-child { border-bottom: none; }
    .stat-key { color: #444; }
    .stat-val { color: #ccc; font-weight: 500; font-family: monospace; font-size: 0.8rem; }
    .upload-progress { display: none; color: #D4FF00; font-size: 0.8rem; margin-top: 0.5rem; }
  </style>
</head>
<body>

<div class="topbar">
  <a href="/"><img src="/images/alefit-logo.png" alt="AleFit" style="height:36px;width:auto"></a>
  <a href="/" class="topbar-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Back
  </a>
</div>

<div class="page">
  <div class="page-title">My <span>Account</span></div>

  <!-- Profile Hero -->
  <div class="profile-hero">
    <div class="avatar-wrap" onclick="document.getElementById('avatarInput').click()">
      <div class="avatar" id="avatarEl"><span id="avatarInitials">?</span></div>
      <div class="avatar-overlay">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </div>
      <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar(this)"/>
    </div>
    <div class="profile-info">
      <div class="profile-name" id="heroName">Loading…</div>
      <div class="profile-email" id="heroEmail">—</div>
      <div class="profile-badge">
        <svg width="8" height="8" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>
        Member
      </div>
      <div class="upload-hint">Tap photo to change</div>
      <div class="upload-progress" id="uploadProgress">Uploading…</div>
    </div>
  </div>

  <!-- Profile Details -->
  <div class="card">
    <div class="card-label">Profile</div>
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="fullName" placeholder="Your name" autocomplete="name"/>
    </div>
    <div class="field">
      <label>Bio</label>
      <textarea id="bio" placeholder="Tell us about your fitness journey… (optional)" maxlength="250"></textarea>
    </div>
    <div class="field">
      <label>Daily Calorie Goal</label>
      <div class="cal-row">
        <input type="number" id="calorieGoal" placeholder="2000" min="500" max="10000"/>
        <span class="cal-unit">kcal / day</span>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="saveProfileBtn" onclick="saveProfile()">Save Profile</button>
    </div>
    <div class="msg msg-ok" id="profileOk">Profile saved!</div>
    <div class="msg msg-err" id="profileErr"></div>
  </div>

  <!-- Account Info -->
  <div class="card">
    <div class="card-label">Account Info</div>
    <div class="stat-row"><span class="stat-key">Email</span><span class="stat-val" id="infoEmail">—</span></div>
    <div class="stat-row"><span class="stat-key">Account ID</span><span class="stat-val" id="infoId">—</span></div>
    <div class="stat-row"><span class="stat-key">Member since</span><span class="stat-val" id="infoJoined" style="font-family:inherit;font-size:0.875rem">—</span></div>
  </div>

  <!-- Change Password -->
  <div class="card">
    <div class="card-label">Change Password</div>
    <div class="field">
      <label>New Password</label>
      <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" autocomplete="new-password"/>
    </div>
    <div class="field">
      <label>Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Repeat password" autocomplete="new-password"/>
    </div>
    <div class="btn-row">
      <button class="btn" onclick="changePassword()">Update Password</button>
    </div>
    <div class="msg msg-ok" id="pwOk">Password updated!</div>
    <div class="msg msg-err" id="pwErr"></div>
  </div>

  <!-- Sign Out -->
  <div class="card">
    <div class="card-label">Session</div>
    <button class="btn-danger" onclick="logout()">Sign Out</button>
  </div>
</div>

<script>
(function() {
  var APP_ID = '6a1f3d189ebdbe71fa7d256c';
  var token = localStorage.getItem('base44_access_token') || localStorage.getItem('token');
  var user = null;

  if (!token) {
    window.location.replace('/Login.html?from_url=' + encodeURIComponent(window.location.href));
    return;
  }

  function initials(name) {
    if (!name) return '?';
    var p = name.trim().split(/\s+/);
    return (p.length >= 2 ? p[0][0] + p[p.length-1][0] : p[0].substring(0,2)).toUpperCase();
  }

  function setAvatar(url, name) {
    var el = document.getElementById('avatarEl');
    if (url) {
      el.innerHTML = '<img src="' + url + '" alt="avatar"/>';
    } else {
      el.innerHTML = '<span id="avatarInitials">' + initials(name) + '</span>';
    }
  }

  function loadUser() {
    fetch('/api/apps/' + APP_ID + '/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function(r) {
      if (r.status === 401) {
        localStorage.removeItem('base44_access_token');
        localStorage.removeItem('token');
        window.location.replace('/Login.html');
        return null;
      }
      return r.json();
    }).then(function(u) {
      if (!u) return;
      user = u;
      var name = u.full_name || '';
      var email = u.email || '';
      var joined = u.created_date ? new Date(u.created_date).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : '—';
      setAvatar(u.avatar_url, name || email);
      document.getElementById('heroName').textContent = name || email || 'ALEFIT Member';
      document.getElementById('heroEmail').textContent = email;
      document.getElementById('fullName').value = name;
      document.getElementById('bio').value = u.bio || '';
      document.getElementById('calorieGoal').value = u.daily_calorie_goal || 2000;
      document.getElementById('infoEmail').textContent = email;
      document.getElementById('infoId').textContent = (u.id || '—').substring(0, 16) + '…';
      document.getElementById('infoJoined').textContent = joined;
    }).catch(function() {
      document.getElementById('heroName').textContent = 'Could not load profile';
    });
  }

  window.uploadAvatar = function(input) {
    if (!input.files || !input.files[0]) return;
    var file = input.files[0];
    if (file.size > 5 * 1024 * 1024) { alert('Image must be under 5 MB'); return; }
    var prog = document.getElementById('uploadProgress');
    prog.style.display = 'block'; prog.textContent = 'Uploading…';
    var fd = new FormData();
    fd.append('file', file);
    fetch('/api/apps/' + APP_ID + '/auth/avatar', {
      method: 'POST', headers: { 'Authorization': 'Bearer ' + token }, body: fd
    }).then(function(r) { return r.json(); }).then(function(d) {
      prog.style.display = 'none';
      if (d.avatar_url) {
        setAvatar(d.avatar_url, user ? user.full_name : '');
      } else {
        alert(d.error || 'Upload failed');
      }
    }).catch(function() { prog.style.display = 'none'; alert('Upload failed'); });
  };

  window.saveProfile = function() {
    var btn = document.getElementById('saveProfileBtn');
    hide(['profileOk','profileErr']);
    btn.disabled = true; btn.textContent = 'Saving…';
    var payload = {
      full_name: document.getElementById('fullName').value.trim(),
      bio: document.getElementById('bio').value.trim(),
      daily_calorie_goal: parseInt(document.getElementById('calorieGoal').value) || 2000
    };
    fetch('/api/apps/' + APP_ID + '/auth/me', {
      method: 'PUT',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function(r) { return r.json(); }).then(function(d) {
      btn.disabled = false; btn.textContent = 'Save Profile';
      if (d.id || d.email) {
        user = d;
        document.getElementById('heroName').textContent = d.full_name || d.email;
        setAvatar(d.avatar_url, d.full_name || d.email);
        show('profileOk');
        localStorage.setItem('alefit_user', JSON.stringify(d));
      } else {
        showErr('profileErr', d.error || 'Save failed');
      }
    }).catch(function() { btn.disabled = false; btn.textContent = 'Save Profile'; showErr('profileErr','Network error'); });
  };

  window.changePassword = function() {
    hide(['pwOk','pwErr']);
    var pw = document.getElementById('newPassword').value;
    var pw2 = document.getElementById('confirmPassword').value;
    if (pw.length < 8) { showErr('pwErr','Password must be at least 8 characters.'); return; }
    if (pw !== pw2) { showErr('pwErr','Passwords do not match.'); return; }
    fetch('/api/apps/' + APP_ID + '/auth/change-password', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
      body: JSON.stringify({ new_password: pw })
    }).then(function(r) { return r.json(); }).then(function(d) {
      if (d.message) {
        show('pwOk');
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
      } else { showErr('pwErr', d.error || 'Could not change password.'); }
    }).catch(function() { showErr('pwErr','Network error'); });
  };

  window.logout = function() {
    localStorage.removeItem('base44_access_token');
    localStorage.removeItem('token');
    localStorage.removeItem('alefit_user');
    window.location.replace('/');
  };

  function show(id) { document.getElementById(id).style.display = 'block'; }
  function hide(ids) { ids.forEach(function(id) { document.getElementById(id).style.display = 'none'; }); }
  function showErr(id, msg) { var el = document.getElementById(id); el.textContent = msg; el.style.display = 'block'; }

  loadUser();
})();
</script>
</body>
</html>
