<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | ALEFIT</title>
  <link rel="icon" href="https://media.base44.com/images/public/6a1f3d189ebdbe71fa7d256c/c88292ed9_logo.png" type="image/png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.4);
    }
    .logo {
      text-align: center;
      margin-bottom: 2rem;
    }
    .logo h1 {
      font-size: 2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.05em;
    }
    .logo p { color: #94a3b8; font-size: 0.875rem; margin-top: 0.25rem; }
    h2 { color: #f1f5f9; font-size: 1.375rem; font-weight: 600; margin-bottom: 1.5rem; text-align: center; }
    label { display: block; color: #94a3b8; font-size: 0.8125rem; font-weight: 500; margin-bottom: 0.375rem; }
    .field { margin-bottom: 1.125rem; }
    input[type=email], input[type=password], input[type=text] {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0.5rem;
      padding: 0.6875rem 0.875rem;
      color: #f1f5f9;
      font-size: 0.9375rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #3b82f6; }
    input::placeholder { color: #475569; }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.75rem;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.92; }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      background: #450a0a;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
      border-radius: 0.5rem;
      padding: 0.75rem 0.875rem;
      font-size: 0.875rem;
      margin-bottom: 1rem;
      display: none;
    }
    .links {
      text-align: center;
      margin-top: 1.25rem;
      color: #64748b;
      font-size: 0.875rem;
    }
    .links a { color: #60a5fa; text-decoration: none; font-weight: 500; }
    .links a:hover { text-decoration: underline; }
    .divider { margin: 0.75rem 0; }
  </style>
  <!-- Vercel Web Analytics -->
  <script>
   window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>ALEFIT</h1>
    <p>Elite Performance Training</p>
  </div>
  <h2>Sign In</h2>
  <div class="error-msg" id="errorMsg"></div>
  <form id="loginForm">
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign In</button>
  </form>
  <div class="links">
    <div class="divider"><a href="/ForgotPassword.html">Forgot password?</a></div>
    <div>Don't have an account? <a href="/Register.html">Create one</a></div>
  </div>
</div>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var fromUrl = params.get('from_url') || '/';

  var token = localStorage.getItem('base44_access_token') || localStorage.getItem('token');
  if (token) {
    window.location.replace(fromUrl);
    return;
  }

  var form = document.getElementById('loginForm');
  var errorMsg = document.getElementById('errorMsg');
  var submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;

    try {
      var resp = await fetch('/api/apps/6a1f3d189ebdbe71fa7d256c/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email, password: password})
      });
      var data = await resp.json();
      if (resp.ok && data.access_token) {
        localStorage.setItem('base44_access_token', data.access_token);
        localStorage.setItem('token', data.access_token);
        if (data.user) localStorage.setItem('alefit_user', JSON.stringify(data.user));
        window.location.replace(fromUrl);
      } else {
        showError(data.error || data.message || 'Login failed. Check your email and password.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    } catch(err) {
      showError('Network error. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
})();
</script>
</body>
</html>
