<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | ALEFIT</title>
  <link rel="icon" href="/images/c88292ed9_logo.png" type="image/png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
      background: #0f0f0f;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      background: #111111;
      border: 1px solid #222222;
      border-radius: 0.75rem;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }
    .logo { text-align: center; margin-bottom: 2rem; }
    .logo h1 {
      font-size: 2rem; font-weight: 900;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: #fff;
    }
    .logo h1 span { color: #D4FF00; }
    .logo p { color: #555; font-size: 0.8125rem; margin-top: 0.25rem; letter-spacing: 0.06em; text-transform: uppercase; }
    h2 { color: #fff; font-size: 1.25rem; font-weight: 700; margin-bottom: 1.25rem; text-align: center; letter-spacing: 0.04em; }
    label { display: block; color: #666; font-size: 0.75rem; font-weight: 600; margin-bottom: 0.375rem; letter-spacing: 0.06em; text-transform: uppercase; }
    .field { margin-bottom: 1.125rem; }
    input[type=email], input[type=password], input[type=text] {
      width: 100%; background: #0a0a0a; border: 1px solid #2a2a2a;
      border-radius: 0.375rem; padding: 0.6875rem 0.875rem;
      color: #fff; font-size: 0.9375rem; outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #D4FF00; }
    input::placeholder { color: #333; }
    .btn {
      width: 100%; background: #D4FF00;
      color: #000; border: none; border-radius: 0.375rem;
      padding: 0.8125rem; font-size: 0.9rem; font-weight: 800;
      cursor: pointer; margin-top: 0.5rem; letter-spacing: 0.06em;
      text-transform: uppercase; transition: opacity 0.15s, transform 0.1s;
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .error-msg {
      background: rgba(220,38,38,0.08); border: 1px solid rgba(220,38,38,0.3); color: #fca5a5;
      border-radius: 0.375rem; padding: 0.75rem 0.875rem;
      font-size: 0.875rem; margin-bottom: 1rem; display: none;
    }
    .links { text-align: center; margin-top: 1.25rem; color: #444; font-size: 0.8125rem; }
    .links a { color: #D4FF00; text-decoration: none; font-weight: 600; }
    .links a:hover { text-decoration: underline; }
    .links-row { display: flex; justify-content: space-between; margin-top: 0.75rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <h1>ALE<span>FIT</span></h1>
    <p>Elite Performance Training</p>
  </div>
  <h2>Sign In</h2>
  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email"/>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn" id="submitBtn">Sign In</button>
  </form>
  <div class="links">
    <div class="links-row">
      <a href="/ForgotPassword.html">Forgot password?</a>
      <a href="/Register.html">Create account</a>
    </div>
  </div>
</div>
<script>
(function() {
  var APP_ID = '6a1f3d189ebdbe71fa7d256c';
  var params = new URLSearchParams(window.location.search);
  var fromUrl = params.get('from_url') || '/';

  var token = localStorage.getItem('base44_access_token') || localStorage.getItem('token');
  if (token) {
    fetch('/api/apps/' + APP_ID + '/auth/me', {
      headers: { 'Authorization': 'Bearer ' + token }
    }).then(function(r) {
      if (r.ok) {
        window.location.replace(fromUrl);
      } else {
        localStorage.removeItem('base44_access_token');
        localStorage.removeItem('token');
        localStorage.removeItem('alefit_user');
      }
    }).catch(function() {});
    return;
  }

  var form = document.getElementById('loginForm');
  var errorMsg = document.getElementById('errorMsg');
  var submitBtn = document.getElementById('submitBtn');

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.style.display = 'block';
  }

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errorMsg.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    try {
      var resp = await fetch('/api/apps/' + APP_ID + '/auth/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email, password: password})
      });
      var data = await resp.json();
      if (resp.ok && data.access_token) {
        localStorage.setItem('base44_access_token', data.access_token);
        localStorage.setItem('token', data.access_token);
        if (data.user) localStorage.setItem('alefit_user', JSON.stringify(data.user));
        var dest = new URL(fromUrl, window.location.origin);
        dest.searchParams.set('access_token', data.access_token);
        window.location.replace(dest.toString());
      } else {
        showError(data.error || data.message || 'Login failed. Check your email and password.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    } catch(err) {
      showError('Network error. Please try again.');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  });
})();
</script>
</body>
</html>
