  <style>

<body>

<div class="hero">
  <a href="/" class="back">← Back</a>
  <div>
    <div class="hero-tag"><span>Program 03 — Mobility</span></div>
    <h1>MOBILITY</h1>
    <p class="hero-sub">6-week flexibility and recovery program. Every hold, every flow, every rest interval — mapped out with purpose.</p>
  </div>
</div>

<div class="stats-bar">
  <div class="stat"><span class="stat-val">6 Weeks</span><span class="stat-lbl">Duration</span></div>
  <div class="stat"><span class="stat-val">Recovery</span><span class="stat-lbl">Focus</span></div>
  <div class="stat"><span class="stat-val">3</span><span class="stat-lbl">Sessions/wk</span></div>
</div>

<div class="body">
  <h2 class="section-title">6-WEEK <span>BREAKDOWN</span></h2>
  <div class="weeks" id="weeks"></div>
</div>

<script>
var PROGRAM = [
  {week:"Week 1–2",label:"Restore",sessions:[
    {day:"Monday",workout:"Hip & Lower Back",duration:"30 min",exercises:[
      {name:"90/90 Hip Stretch",sets:3,reps:"60s each side",rest:"15s between sides",desc:"Sit with both knees bent at 90° in front and behind you. Keep chest tall and lean into the front hip. This unlocks tight hip flexors and external rotators compressed by sitting."},
      {name:"Pigeon Pose",sets:2,reps:"90s each side",rest:"20s",desc:"From all fours, bring one shin across to rest parallel to your hips. The pigeon pose is the deepest hip opener in yoga — feel the stretch deep in the glute and outer hip."},
      {name:"Couch Stretch",sets:2,reps:"60s each leg",rest:"15s",desc:"Rear shin against a wall or couch, front foot forward. This aggressively targets the hip flexor and quad — the two muscles most shortened by desk work and sport."},
      {name:"Cat-Cow",sets:2,reps:"10 slow reps",rest:"None",desc:"On hands and knees, inhale and arch the spine (cow), exhale and round it (cat). Synchronize with your breath. This warms the spine and restores natural lumbar movement patterns."}
    ]},
    {day:"Wednesday",workout:"Thoracic & Shoulders",duration:"30 min",exercises:[
      {name:"Thread the Needle",sets:3,reps:"8 reps each side",rest:"15s",desc:"From hands and knees, slide one arm under your body and rotate the thoracic spine. This targets the rotation that stiff thoracic spines resist — every sport needs this."},
      {name:"Chest Opener (foam roller)",sets:3,reps:"60s hold",rest:"20s",desc:"Lie over a foam roller placed across your mid-back, arms spread wide. Gravity pulls the chest open and extends the thoracic spine — the direct antidote to forward-rounded posture."},
      {name:"Wall Shoulder Slides",sets:3,reps:"12 reps",rest:"30s",desc:"Stand with back and arms flat on wall. Slide arms overhead while keeping all contact points on the wall. Trains shoulder mobility in the correct overhead range without compensation."},
      {name:"Doorway Stretch",sets:2,reps:"45s each angle",rest:"None",desc:"Place forearms in a doorway and lean through. First at shoulder height, then higher. Progressively opens the anterior shoulder and chest that tighten with age and training."}
    ]},
    {day:"Friday",workout:"Full Body Flow",duration:"40 min",exercises:[
      {name:"Sun Salutation A",sets:5,reps:"1 full flow",rest:"30s between flows",desc:"Move through standing, fold, plank, upward dog, downward dog and back. Each transition teaches the body to flow between shapes — coordination and flexibility together."},
      {name:"World's Greatest Stretch",sets:3,reps:"5 reps each side",rest:"20s",desc:"Step into a lunge, place same-side hand to floor, rotate opposite arm to ceiling. This single move covers hip flexor, thoracic rotation, hamstring, and ankle mobility — the most efficient stretch you can do."},
      {name:"Deep Squat Hold",sets:3,reps:"60s",rest:"30s",desc:"Full squat, heels flat, elbows press knees out from the inside. The deep squat is the resting position humans spent millennia in. Restoring it changes how your hips, knees, and ankles function."}
    ]}
  ]},
  {week:"Week 3–4",label:"Deepen",sessions:[
    {day:"Monday",workout:"Active Flexibility",duration:"35 min",exercises:[
      {name:"PNF Hamstring Stretch",sets:3,reps:"7s contract / 30s relax",rest:"20s",desc:"Lie on back, leg up. Push it into your hands (as if trying to lower it) for 7 seconds, then relax and go deeper. PNF is the most effective stretching technique — contract-relax overrides the stretch reflex."},
      {name:"PNF Hip Flexor Stretch",sets:3,reps:"7s contract / 30s relax",rest:"20s",desc:"In a deep lunge, squeeze the back glute to extend the hip, then relax into deeper flexion. Activating the opposing muscle before the stretch gives an extra 10–15° of range."},
      {name:"Cossack Squat",sets:3,reps:"8 reps each side",rest:"45s",desc:"Wide stance, shift weight over one heel and descend into a deep lateral squat while the other leg extends flat. Combines hip abduction, hip flexion, and ankle mobility in one movement."},
      {name:"Active Pigeon",sets:2,reps:"10 reps each side",rest:"30s",desc:"From pigeon pose, actively lift the torso up and lower back down using hip muscles — don't just hang in the position. Active flexibility builds strength in lengthened positions, not just passive range."}
    ]},
    {day:"Wednesday",workout:"Yoga Foundations",duration:"45 min",exercises:[
      {name:"Warrior I → Warrior II → Reverse Warrior",sets:3,reps:"5 breaths each pose",rest:"30s between sequences",desc:"Move through each warrior position with controlled breath. Warrior I opens the hip flexor, Warrior II builds lateral hip stability, Reverse Warrior adds thoracic rotation and lateral body stretch."},
      {name:"Triangle Pose",sets:2,reps:"60s each side",rest:"20s",desc:"Wide stance, reach the front arm down to the shin or floor while the other reaches to the ceiling. Opens the lateral body, hamstring, and thoracic spine simultaneously — a complete side-body decompression."},
      {name:"Half-Moon Pose",sets:2,reps:"45s each side",rest:"20s",desc:"Balance on one hand and foot while the body opens sideways. Half-moon combines hip abduction, balance, and full lateral chain opening — and it's harder than it looks."},
      {name:"Child's Pose",sets:1,reps:"2 min hold",rest:"None",desc:"Kneel, lower hips toward heels, arms extended forward. A full reset for the entire posterior chain and spine. Breathe into your lower back — feel the ribcage expand."}
    ]},
    {day:"Friday",workout:"Myofascial Release",duration:"35 min",exercises:[
      {name:"Foam Roll — IT Band",sets:2,reps:"60s each side",rest:"15s",desc:"Roll from the hip to just above the knee along the outer thigh. Pause on tender spots and breathe. The IT band is almost always tight in runners, cyclists, and strength athletes — this is maintenance work."},
      {name:"Foam Roll — Thoracic Spine",sets:2,reps:"60s",rest:"None",desc:"Roller under mid-back, support head, extend over the roller. Work segment by segment up the spine. Directly addresses the extension that office posture and bench pressing remove."},
      {name:"Lacrosse Ball — Glutes",sets:2,reps:"60s each side",rest:"15s",desc:"Sit on a lacrosse ball placed under one glute. Cross the leg and search for dense spots. The piriformis and deep rotators embedded in the glute are inaccessible by stretching alone — a ball gets there."},
      {name:"Foam Roll — Lats",sets:2,reps:"45s each side",rest:"15s",desc:"Side-lying with the arm overhead, roller under the lat and teres major. The lat is one of the largest muscles in the body — tension here restricts shoulder overhead mobility and contributes to lower-back pain."}
    ]}
  ]},
  {week:"Week 5–6",label:"Integrate",sessions:[
    {day:"Monday",workout:"Yin Yoga Deep Holds",duration:"45 min",exercises:[
      {name:"Dragon Pose (hip flexor)",sets:1,reps:"4 min each side",rest:"30s transition",desc:"Deep lunge with back knee on the ground, held passively for 4 minutes. Yin targets connective tissue — fascia and ligaments — which require long holds to remodel. You'll feel this work deep in the front hip capsule."},
      {name:"Sleeping Swan (deep pigeon)",sets:1,reps:"4 min each side",rest:"30s transition",desc:"Pigeon pose with the torso folded forward over the front shin. Four minutes per side allows the sacrotuberous ligament and hip capsule to genuinely release — not just the surface muscles."},
      {name:"Caterpillar (seated forward fold)",sets:1,reps:"4 min",rest:"30s",desc:"Seated, legs extended, fold forward with a rounded spine. Let gravity do the work — no forcing. Yin forward folds target the posterior chain connective tissue and decompress the lumbar discs."},
      {name:"Supine Twist",sets:1,reps:"3 min each side",rest:"None",desc:"Lie on back, one knee crosses over to the opposite side while the same arm extends out. Gravity rotates the spine. This hold releases the posterior capsule of the hip and decompresses the vertebral joints."}
    ]},
    {day:"Wednesday",workout:"Movement Flow",duration:"40 min",exercises:[
      {name:"Animal Flow — Beast Crawl",sets:4,reps:"20m forward + back",rest:"30s",desc:"In a push-up position with knees hovering 2cm from the ground, crawl forward by moving opposite hand and foot simultaneously. Beast crawl teaches the contralateral coordination pattern that underlies all human locomotion."},
      {name:"Animal Flow — Crab Reach",sets:3,reps:"8 reps each side",rest:"20s",desc:"In a reverse table position (crab), extend one arm overhead and rotate your hips toward the ceiling. Crab reach targets the anterior shoulder, hip flexors, and thoracic rotation all at once."},
      {name:"Single-Leg Balance Hold",sets:3,reps:"60s each leg",rest:"20s",desc:"Stand on one leg with the other slightly raised. Focus your gaze on a fixed point. This seemingly simple exercise activates hundreds of stabilizing muscles around the ankle, knee, and hip — it is proprioception training."},
      {name:"Turkish Get-Up (bodyweight)",sets:3,reps:"3 each side",rest:"60s",desc:"From lying, stand up with one arm held overhead, then reverse back to the floor — keeping that arm vertical throughout. Every joint in the body is challenged. One of the most comprehensive movement assessments in existence."}
    ]},
    {day:"Friday",workout:"Range of Motion Test",duration:"40 min",exercises:[
      {name:"Toe Touch Test",sets:1,reps:"Measure reach vs. Week 1",rest:"None",desc:"Stand tall, reach for the floor. Measure how close you get. This tests hamstring, calf, and lumbar flexibility simultaneously. Compare to your Week 1 measurement — the data tells you what 6 weeks accomplished."},
      {name:"Hip Internal Rotation Check",sets:1,reps:"Both sides — note degrees",rest:"None",desc:"Sit on a bench, swing the lower leg out to check hip internal rotation range. Measure both sides and compare. Internal rotation loss is the first sign of hip deterioration — restoring it is protective."},
      {name:"Shoulder Mobility Test",sets:1,reps:"Overhead reach test",rest:"None",desc:"Stand against a wall, arms overhead, try to keep your lower back against the wall. Measure how high you can reach. Restricted overhead mobility leaves you vulnerable in every overhead sport and activity."},
      {name:"Full Flow Sequence",sets:1,reps:"20 min — all learned movements",rest:"As needed",desc:"Link all the movements from the past 6 weeks into one continuous flow. This is your final assessment — can you move through every position with control, breath, and ease? That's the goal."}
    ]}
  ]}
];

function render() {
  var weeks = document.getElementById('weeks');
  PROGRAM.forEach(function(wk) {
    var div = document.createElement('div');
    div.innerHTML = '<div class="week-head"><span class="week-label">'+wk.week+'</span><div class="week-divider"></div><span class="week-sub">'+wk.label+'</span></div>' +
      '<div class="sessions">' +
      wk.sessions.map(function(s) {
        return '<div class="session-card">' +
          '<div class="session-head"><div><div class="session-day">'+s.day+'</div><div class="session-name">'+s.workout+'</div></div><div class="session-dur">'+s.duration+'</div></div>' +
          '<div class="exercises">' +
          s.exercises.map(function(ex) {
            return '<div class="ex"><div class="ex-name">'+ex.name+'</div>' +
              '<div class="ex-desc">'+ex.desc+'</div>' +
              '<div class="ex-meta"><span class="badge badge-lime">'+ex.sets+' sets</span><span class="badge badge-grey">'+ex.reps+'</span></div>' +
              '<span class="badge-rest">Rest: '+ex.rest+'</span></div>';
          }).join('') +
          '</div></div>';
      }).join('') +
      '</div>';
    weeks.appendChild(div);
  });
}
render();
</script>
</body>
</html>
