var GYM = [{"week": "Week 1-2", "label": "Athletic Base", "sessions": [{"day": "Monday", "workout": "Lower Explosive", "duration": "60 min", "exercises": [{"name": "Back Squat", "sets": 4, "reps": "6 reps @ 70%", "rest": "2 min", "desc": "Full depth, controlled descent. Basketball demands repeated explosive jumps - squat strength is the foundation that makes every jump higher and every landing safer."}, {"name": "Box Jump", "sets": 4, "reps": "5 reps", "rest": "90s", "desc": "Maximum height, land softly, step down. Box jumps train the reactive strength behind your vertical. Every inch added in the gym shows up at the rim. Record height."}, {"name": "Calf Raise", "sets": 4, "reps": "20 reps", "rest": "60s", "desc": "Full range, pause at bottom. Calf strength and Achilles tendon stiffness are major contributors to jump height. Basketball players need calves as strong as sprinters."}, {"name": "Single-Leg Press", "sets": 3, "reps": "12 each leg", "rest": "90s", "desc": "One foot on the platform. Single-leg pressing mirrors the push-off of a jump shot, layup, and drive - every decisive basketball movement happens on one leg."}]}, {"day": "Wednesday", "workout": "Agility & Speed", "duration": "50 min", "exercises": [{"name": "Lateral Shuffle Drill", "sets": 6, "reps": "10m each direction", "rest": "60s", "desc": "Stay in athletic position, shuffle laterally as fast as possible. Defensive footwork is won in the gym - hip abductor strength and lateral quickness come from specific lateral work."}, {"name": "T-Drill", "sets": 5, "reps": "1 rep", "rest": "90s", "desc": "Sprint 5m, shuffle right 2.5m, shuffle left 5m, shuffle right 2.5m, back-pedal. Record time. The T-drill covers every footwork pattern in basketball in one drill."}, {"name": "Depth Jump", "sets": 4, "reps": "5 reps", "rest": "2 min", "desc": "Step off box, land, immediately jump as high as possible. Depth jumps train the reactive strength of the Achilles and quad - the same quality that adds inches to your vertical."}, {"name": "Half-Court Sprint", "sets": 8, "reps": "1 rep", "rest": "60s", "desc": "Full-effort half-court sprint. First-step quickness wins possessions - train it with maximum intensity."}]}, {"day": "Friday", "workout": "Strength & Core", "duration": "55 min", "exercises": [{"name": "Trap Bar Deadlift", "sets": 4, "reps": "5 reps", "rest": "2 min", "desc": "Neutral grip, hips in line with shoulders. Full body strength in the basketball-specific position - upright torso, powerful hip drive. The foundation of your explosiveness."}, {"name": "Pallof Press", "sets": 3, "reps": "12 each side", "rest": "60s", "desc": "Anti-rotation core stability. The core must stabilize rotationally during every change of direction - Pallof press trains this specific quality."}, {"name": "Nordic Hamstring Curl", "sets": 3, "reps": "5 reps", "rest": "2 min", "desc": "Anchor heels, lower body as slowly as possible. Hamstring injury prevention - the research is extensive and the exercise is uniquely effective."}, {"name": "Copenhagen Plank", "sets": 3, "reps": "30s each side", "rest": "30s", "desc": "Side plank with top foot on bench. Adductor and hip stability - the groin and inner thigh strength that keeps you healthy through a long season of lateral movements."}]}]}, {"week": "Week 3-4", "label": "Vertical Peak", "sessions": [{"day": "Monday", "workout": "Jump Development", "duration": "65 min", "exercises": [{"name": "Back Squat", "sets": 5, "reps": "4 reps @ 80%", "rest": "3 min", "desc": "Heavier load. Strength gains are directly proportional to vertical improvement - every pound added to your squat max translates to inches on your vertical."}, {"name": "Depth Drop to Vertical", "sets": 5, "reps": "5 reps", "rest": "2 min", "desc": "Step off box, absorb, immediately jump maximally. The most effective plyometric for basketball-specific reactive strength. Ground contact under 0.25 seconds is the target."}, {"name": "Step-Up Jump", "sets": 4, "reps": "8 each leg", "rest": "90s", "desc": "Step up explosively from one leg, drive into a jump at the top. The one-leg jump is how you score at the rim - this builds the exact single-leg power behind it."}, {"name": "Approach Jump", "sets": 5, "reps": "5 reps", "rest": "90s", "desc": "Two-step approach into a maximum jump. Game-specific vertical - not a standing jump, but the approach used on alley-oops and layups. This is what actually shows up."}]}, {"day": "Wednesday", "workout": "Speed & Reaction", "duration": "55 min", "exercises": [{"name": "Lateral Band Walk", "sets": 3, "reps": "20 each direction", "rest": "45s", "desc": "Band above knees, squat position, step laterally. Hip abductor strength is the foundation of defensive footwork. If your hips are weak, your feet will be slow."}, {"name": "5-10-5 Shuttle", "sets": 6, "reps": "1 rep", "rest": "90s", "desc": "Record every rep. Your change-of-direction speed benchmark - the most applicable athletic test for basketball perimeter defense."}, {"name": "Medicine Ball Slam", "sets": 4, "reps": "10 reps", "rest": "60s", "desc": "Overhead to floor with maximum force. Full-body power development in a vertical pattern - the same muscle sequence as a jump and finish."}, {"name": "Full Court Sprint x8", "sets": 8, "reps": "1 rep", "rest": "60s", "desc": "End-to-end at absolute maximum. Peak sprint conditioning. Eight reps simulates the high-intensity work of a full game."}]}, {"day": "Friday", "workout": "Strength & Power", "duration": "60 min", "exercises": [{"name": "Deadlift", "sets": 4, "reps": "5 reps", "rest": "2 min", "desc": "Conventional pull, max load. Total posterior chain strength - the engine behind your jumping power. Record weight."}, {"name": "Hanging Leg Raise", "sets": 3, "reps": "15 reps", "rest": "60s", "desc": "Full hang, lift legs to 90 degrees. Hip flexor and lower ab strength - the muscles that generate the knee drive behind your jump."}, {"name": "Box Jump Max Height", "sets": 5, "reps": "5 reps", "rest": "2 min", "desc": "Find your maximum jump height. Your vertical benchmark at the end of week 4. Compare to week 1."}, {"name": "Farmer Carry", "sets": 3, "reps": "40m", "rest": "75s", "desc": "Heavy and upright. Full-body stability and grip strength - the athletic foundation underneath every other quality you are developing."}]}]}, {"week": "Week 5-6", "label": "Game Shape", "sessions": [{"day": "Monday", "workout": "Peak Vertical", "duration": "65 min", "exercises": [{"name": "Back Squat 3RM", "sets": 1, "reps": "3 rep max", "rest": "5 min", "desc": "Your strength benchmark. Record it. Six weeks of consistent loading should show measurable progress. Strength is the variable that controls your ceiling."}, {"name": "Vertical Jump Max", "sets": 5, "reps": "5 reps", "rest": "2 min", "desc": "Your vertical benchmark at program end. Compare to week 1 - six weeks of specific training should show a clear improvement."}, {"name": "Approach Jump", "sets": 5, "reps": "5 reps", "rest": "90s", "desc": "Game-specific vertical at program peak. This is what actually shows up in competition."}, {"name": "Reactive Jump Complex", "sets": 4, "reps": "5 jumps", "rest": "2 min", "desc": "5 continuous vertical jumps, minimum ground time. Reactive endurance - the quality that keeps you jumping at the same height in the 4th quarter."}]}, {"day": "Wednesday", "workout": "Court Speed", "duration": "55 min", "exercises": [{"name": "Full Court Sprint x10", "sets": 3, "reps": "10 lengths", "rest": "2 min", "desc": "Ten half-court lengths at maximum pace, 3 sets. Peak sprint conditioning. If your pace drops on length 7, that is your conditioning ceiling."}, {"name": "T-Drill Best Time", "sets": 6, "reps": "1 rep", "rest": "90s", "desc": "Compare to week 1. Your agility improvement benchmark."}, {"name": "Lateral Shuffle 20m", "sets": 6, "reps": "1 rep", "rest": "60s", "desc": "Maximum-effort lateral shuffle. Defensive speed at its peak. Record time."}, {"name": "Jump Fatigue Test", "sets": 3, "reps": "10 jumps", "rest": "60s", "desc": "10 vertical jumps, record average height. Reactive endurance - can you maintain your vertical in the 4th quarter?"}]}, {"day": "Friday", "workout": "Benchmark Day", "duration": "60 min", "exercises": [{"name": "Deadlift 1RM", "sets": 1, "reps": "1 rep max", "rest": "5 min", "desc": "Your total strength number at program end. Record and compare."}, {"name": "Standing Broad Jump", "sets": 5, "reps": "5 reps", "rest": "90s", "desc": "Horizontal power benchmark. Compare to week 1."}, {"name": "Single-Leg Vertical", "sets": 3, "reps": "5 each leg", "rest": "90s", "desc": "One-leg vertical jump - the actual jump used in basketball. Record height."}, {"name": "5-10-5 Best Time", "sets": 3, "reps": "1 rep", "rest": "2 min", "desc": "Your agility benchmark at program end. Best of three. Record the improvement."}]}]}];

var currentTab = 'gym';
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  currentTab = tab;
  renderWeeks();
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function renderWeeks() {
  var data = currentTab === 'gym' ? GYM : currentTab === 'dumbbell' ? DUMBBELL : HOME;
  var container = document.getElementById('weeks');
  container.innerHTML = '';
  data.forEach(function(wk) {
    var wkDiv = document.createElement('div');
    var sessHtml = wk.sessions.map(function(s) {
      var exHtml = s.exercises.map(function(ex) {
        return '<div class="ex"><div class="ex-name">'+esc(ex.name)+'</div><div class="ex-desc">'+esc(ex.desc)+'</div><div class="ex-meta"><span class="badge badge-lime">'+esc(ex.sets)+' sets x '+esc(ex.reps)+'</span><span class="badge badge-grey">Rest: '+esc(ex.rest)+'</span></div></div>';
      }).join('');
      return '<div class="session-card"><div class="session-head"><div><div class="session-day">'+esc(s.day)+'</div><div class="session-name">'+esc(s.workout)+'</div></div><div class="session-dur">'+esc(s.duration)+'</div></div><div class="exercises">'+exHtml+'</div></div>';
    }).join('');
    wkDiv.innerHTML = '<div class="week-head"><span class="week-label">'+esc(wk.week)+'</span><div class="week-divider"></div><span class="week-sub">'+esc(wk.label)+'</span></div><div class="sessions">'+sessHtml+'</div>';
    container.appendChild(wkDiv);
  });
}
renderWeeks();
