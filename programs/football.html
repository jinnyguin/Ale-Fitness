er needed to maintain blocks at the point of attack."}, {"name": "Pull-Up", "sets": 3, "reps": "Max reps", "rest": "90s", "desc": "Full hang to chin above bar. Vertical pulling strength builds the latissimus dorsi mass that makes pass rushers hard to push wide and linebackers explosive off the jam."}]}, {"day": "Thursday", "workout": "Lower Strength", "duration": "65 min", "exercises": [{"name": "Deadlift", "sets": 5, "reps": "3 reps @ 80%", "rest": "3 min", "desc": "Double overhand or mixed grip, drive floor away. The deadlift tests total posterior chain strength - the exact musculature that determines whether you drive defenders backward or get driven yourself."}, {"name": "Front Squat", "sets": 4, "reps": "6 reps", "rest": "2 min", "desc": "Bar across the front deltoids, torso upright. The front squat forces correct upright posture under load - the position you need to maintain contact and drive through a block."}, {"name": "Nordic Hamstring Curl", "sets": 3, "reps": "6 reps", "rest": "2 min", "desc": "Anchor heels, lower body as slowly as possible. Hamstring strains end seasons. The Nordic curl is the most evidence-backed hamstring injury prevention exercise available."}, {"name": "Farmer Carry", "sets": 4, "reps": "40m", "rest": "60s", "desc": "Heavy dumbbells, walk with upright posture. Grip strength and full-body stability - the foundation of every hand fight. Carry heavy, walk tall, breathe through it."}]}, {"day": "Friday", "workout": "Explosiveness", "duration": "55 min", "exercises": [{"name": "Power Clean", "sets": 5, "reps": "3 reps", "rest": "2 min", "desc": "From the floor, explode through the hips and catch the bar in the rack position. The power clean trains the same triple-extension pattern as a drive block and a tackle."}, {"name": "Broad Jump", "sets": 4, "reps": "5 reps", "rest": "90s", "desc": "Maximum horizontal jump. Broad jump performance correlates directly with sprint speed and cutting ability. Football players who broad jump farther tend ide. Width and strength come together here."}, {"name": "Hammer Curl", "sets": 3, "reps": "12 each arm", "rest": "60s", "desc": "Neutral grip, control the descent. Brachialis and forearm development for grip strength - you cannot tackle what you cannot hold."}, {"name": "Face Pull", "sets": 3, "reps": "15 reps", "rest": "60s", "desc": "Shoulder health maintenance. As weights peak, shoulder care becomes critical - this is the insurance premium."}]}]}, {"week": "Week 6-8", "label": "Peak Strength", "sessions": [{"day": "Monday", "workout": "Max Lower", "duration": "75 min", "exercises": [{"name": "Back Squat 3RM", "sets": 1, "reps": "3 rep max", "rest": "5 min", "desc": "Work up to your 3-rep max. Your squat number is your football strength number - record it, compare to week 1. Strength is the variable. Build it."}, {"name": "Power Clean Peak", "sets": 4, "reps": "3 reps @ peak", "rest": "3 min", "desc": "Peak weight. The clean is your explosiveness benchmark. Every pound here represents a yard you gain or give back on the field."}, {"name": "Sled Sprint", "sets": 6, "reps": "20m", "rest": "2 min", "desc": "Loaded sprint at program peak. Drive through the ground with every rep."}, {"name": "Box Squat", "sets": 3, "reps": "5 reps", "rest": "2 min", "desc": "Pause on the box, eliminate momentum. Box squatting develops starting strength - the ability to generate force from a dead stop, exactly as you do off the line of scrimmage."}]}, {"day": "Tuesday", "workout": "Max Upper", "duration": "70 min", "exercises": [{"name": "Bench Press 3RM", "sets": 1, "reps": "3 rep max", "rest": "5 min", "desc": "Your bench max. Record it alongside your week 1 number. Eight weeks of progressive training should show a clear increase. Strength is earned, not given."}, {"name": "Push Press Peak", "sets": 4, "reps": "4 reps @ peak", "rest": "2 min", "desc": "Maximum load. Upper body power at its peak."}, {"name": "Barbell Row 3RM", "sets": 1, "reps": "3 rep max", "rest": "5 min", "desc": "Y var DUMBBELL = [{"week": "Week 1-2", "label": "Strength Foundation", "sessions": [{"day": "Monday", "workout": "Lower Power", "duration": "60 min", "exercises": [{"name": "Dumbbell Goblet Squat", "sets": 5, "reps": "6 reps", "rest": "3 min", "desc": "Hold one heavy dumbbell at chest height, full depth. The goblet squat is the most teachable squat pattern - torso stays upright, hips open, drive through the floor. Load it progressively every session."}, {"name": "Dumbbell Romanian Deadlift", "sets": 4, "reps": "8 reps", "rest": "2 min", "desc": "Two dumbbells, hip hinge, lower to mid-shin. Posterior chain strength drives every block and tackle. Control the descent, drive through the hips to lockout."}, {"name": "Dumbbell Lateral Lunge", "sets": 4, "reps": "10 each leg", "rest": "90s", "desc": "Step wide, drive knee out, push back through the heel. Football demands lateral power for cuts and pursuit angles. Lateral loading trains the exact quality needed on the field."}, {"name": "Dumbbell Hip Thrust", "sets": 4, "reps": "10 reps", "rest": "90s", "desc": "Shoulders on bench, dumbbell on hips, drive to full extension. Isolated glute strength powers sprint acceleration and leg drive in a run block. Squeeze at the top."}]}, {"day": "Wednesday", "workout": "Upper Push & Pull", "duration": "55 min", "exercises": [{"name": "Dumbbell Bench Press", "sets": 5, "reps": "6 reps", "rest": "3 min", "desc": "Feet flat, arch the back, lower to chest, press powerfully. Each arm works independently - no weak side can hide. Chest, shoulder, and tricep strength translates directly to blocking power."}, {"name": "Dumbbell Bent-Over Row", "sets": 5, "reps": "8 reps", "rest": "2 min", "desc": "Hip hinge at 45 degrees, row both dumbbells to ribcage. Upper back strength supports every hand-fighting technique and tackle mechanic. Squeeze the scapula at the top of every rep."}, {"name": "Dumbbell Arnold Press", "sets": 4, "reps": "10 reps", "rest": "90s", "desc": "Rotate from palms facing you t rcises": [{"name": "Dumbbell Bench Press Peak", "sets": 4, "reps": "5 rep max", "rest": "4 min", "desc": "Heaviest dumbbell pressing load of the program. Record and compare to week 1. Eight weeks of progressive loading should show a clear increase."}, {"name": "Dumbbell Bent-Over Row Peak", "sets": 4, "reps": "6 reps", "rest": "3 min", "desc": "Maximum row load. Upper back strength at its peak - the pulling force behind every tackle and arm bar."}, {"name": "Dumbbell Push Press Peak", "sets": 4, "reps": "4 reps", "rest": "2 min", "desc": "Maximum load, explosive press. Upper body power at program peak."}, {"name": "Dumbbell Renegade Row Peak", "sets": 3, "reps": "8 each arm", "rest": "2 min", "desc": "Peak load with core control. Upper back and core at maximum - the combination that wins contact at the point of attack."}]}, {"day": "Friday", "workout": "Speed & Power Benchmark", "duration": "60 min", "exercises": [{"name": "40-Yard Dash x5", "sets": 5, "reps": "1 rep", "rest": "3 min", "desc": "Record your best time. Speed benchmark at program end - compare to week 1. Eight weeks of dumbbell power training produces real, measurable speed improvements."}, {"name": "Broad Jump", "sets": 5, "reps": "5 reps", "rest": "90s", "desc": "Horizontal power benchmark. Compare to week 1. The distance gained represents real explosiveness built."}, {"name": "Dumbbell Hip Thrust Peak", "sets": 4, "reps": "10 reps @ peak", "rest": "2 min", "desc": "Maximum glute loading. The glute strength built here powers every explosive sprint and drive."}, {"name": "Dumbbell Bulgarian Split Squat Benchmark", "sets": 3, "reps": "8 each leg @ peak", "rest": "2 min", "desc": "Your unilateral strength benchmark. Compare load to week 1 - this is real, measurable progress."}]}]}];
var currentTab = 'gym';
function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  currentTab = tab;
  renderWeeks();
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function renderWeeks() {
  var data = currentTab === 'gym' ? GYM : currentTab === 'dumbbell' ? DUMBBELL : HOME;
  var container = document.getElementById('weeks');
  container.innerHTML = '';
  data.forEach(function(wk) {
    var wkDiv = document.createElement('div');
    var sessHtml = wk.sessions.map(function(s) {
      var exHtml = s.exercises.map(function(ex) {
        return '<div class="ex"><div class="ex-name">'+esc(ex.name)+'</div><div class="ex-desc">'+esc(ex.desc)+'</div><div class="ex-meta"><span class="badge badge-lime">'+esc(ex.sets)+' sets x '+esc(ex.reps)+'</span><span class="badge badge-grey">Rest: '+esc(ex.rest)+'</span></div></div>';
      }).join('');
      return '<div class="session-card"><div class="session-head"><div><div class="session-day">'+esc(s.day)+'</div><div class="session-name">'+esc(s.workout)+'</div></div><div class="session-dur">'+esc(s.duration)+'</div></div><div class="exercises">'+exHtml+'</div></div>';
    }).join('');
    wkDiv.innerHTML = '<div class="week-head"><span class="week-label">'+esc(wk.week)+'</span><div class="week-divider"></div><span class="week-sub">'+esc(wk.label)+'</span></div><div class="sessions">'+sessHtml+'</div>';
    container.appendChild(wkDiv);
  });
}
renderWeeks();
