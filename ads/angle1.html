<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALEFIT — Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100vw; height: 100vh;
    overflow: hidden;
    background: #0F0F0F;
  }
  .ad {
    width: 100vw; height: 100vh;
    background: #0F0F0F;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 6vh 7vw;
  }
  .logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 4.5vw;
    letter-spacing: 0.05em;
    line-height: 1;
    color: #fff;
  }
  .logo span { color: #D4FF00; }
  .middle {
    display: flex;
    flex-direction: column;
    gap: 2.5vh;
  }
  .headline {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 11vw;
    line-height: 0.95;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: -0.01em;
  }
  .headline em {
    color: #D4FF00;
    font-style: normal;
  }
  .benefit {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 2.4vw;
    color: rgba(255,255,255,0.6);
    line-height: 1.4;
  }
  .cta {
    display: inline-block;
    background: #D4FF00;
    color: #0F0F0F;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 3vw;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 1.6vh 4.5vw;
    border-radius: 0.5vw;
    align-self: flex-start;
  }
  .footer {
    font-family: 'Inter', sans-serif;
    font-size: 1.6vw;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
<div class="ad">
  <div class="logo"><span>ALE</span>FIT</div>
  <div class="middle">
    <div class="headline">Results.<br><em>Not</em><br>Excuses.</div>
    <div class="benefit">Elite training built around your goals.</div>
    <div class="cta">Start Training</div>
  </div>
  <span class="footer">alefit.com</span>
</div>
</body>
</html>
