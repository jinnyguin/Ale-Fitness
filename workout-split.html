<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" href="/images/alefit-logo.png" type="image/png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workout Split Generator — ALEFIT</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--lime:#D4FF00;--dark:#0F0F0F;--card:#141414;--border:rgba(255,255,255,.08)}
body{background:var(--dark);color:#fff;font-family:'Inter',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}
nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2.5rem;border-bottom:1px solid var(--border)}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.5rem;letter-spacing:.18em}
.logo span{color:var(--lime)}
.back{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);transition:color .2s}
.back:hover{color:var(--lime)}
.page-wrap{max-width:900px;margin:0 auto;padding:4rem 2.5rem 6rem}
.page-tag{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .9rem;border:1px solid rgba(212,255,0,.3);color:var(--lime);font-size:.65rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.5rem}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(3rem,6vw,5rem);text-transform:uppercase;line-height:.92;margin-bottom:1rem}
h1 em{color:var(--lime);font-style:normal}
.sub{color:rgba(255,255,255,.4);font-size:.9rem;line-height:1.6;max-width:520px;margin-bottom:3rem}
.setup-card{background:var(--card);border:1px solid var(--border);padding:2rem;margin-bottom:2rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem;margin-bottom:1.5rem}
.field{display:flex;flex-direction:column;gap:.5rem}
.field label{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4);font-weight:600}
.field select{background:#0a0a0a;border:1px solid rgba(255,255,255,.12);color:#fff;padding:.8rem 1rem;font-size:.9rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;-webkit-appearance:none}
.field select:focus{border-color:rgba(212,255,0,.5)}
.field select option{background:#111}
.gen-btn{width:100%;background:var(--lime);color:#000;padding:1rem;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.1rem;letter-spacing:.15em;text-transform:uppercase;border:none;cursor:pointer;transition:opacity .2s}
.gen-btn:hover{opacity:.88}
.split{display:none}.split.show{display:block}
.split-header{margin-bottom:2rem}
.split-title{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2rem;text-transform:uppercase;margin-bottom:.5rem}
.split-desc{color:rgba(255,255,255,.4);font-size:.85rem;line-height:1.6}
.week-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:2rem}
.day-col{background:var(--card);border:1px solid var(--border);overflow:hidden}
.day-col.rest{opacity:.4}
.day-col.active{border-color:rgba(212,255,0,.25)}
.day-header{padding:.6rem .5rem;text-align:center;border-bottom:1px solid var(--border)}
.day-name{font-size:.6rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.4)}
.day-focus{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:.9rem;text-transform:uppercase;margin-top:.2rem;color:#fff}
.day-col.active .day-header{background:rgba(212,255,0,.05)}
.day-col.active .day-focus{color:var(--lime)}
.day-body{padding:.6rem .5rem;font-size:.62rem;color:rgba(255,255,255,.35);line-height:1.6}
.exercises-list{margin-bottom:2rem}
.ex-card{background:var(--card);border:1px solid var(--border);margin-bottom:1rem;overflow:hidden}
.ex-card-header{padding:1.1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);cursor:pointer;user-select:none}
.ex-card-header:hover{background:rgba(255,255,255,.02)}
.ex-day-name{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.1rem;text-transform:uppercase}
.ex-day-focus{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--lime);font-weight:600}
.ex-card-body{padding:1.25rem 1.5rem;display:none}
.ex-card-body.open{display:block}
.ex-table{width:100%;border-collapse:collapse}
.ex-table th{text-align:left;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:.5rem 0;border-bottom:1px solid var(--border);font-weight:600}
.ex-table td{padding:.7rem 0;font-size:.85rem;border-bottom:1px solid rgba(255,255,255,.04)}
.ex-table td:first-child{font-weight:600;color:#fff}
.ex-table td:not(:first-child){color:rgba(255,255,255,.45);font-size:.78rem}
.ex-table tr:last-child td{border-bottom:none}
@media(max-width:640px){.grid-3{grid-template-columns:1fr}.week-grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<nav>
  <a href="/"><img src="/images/alefit-logo.png" alt="AleFit" style="height:40px;width:auto"></a>
  <a href="/#tools" class="back">← Back to Site</a>
</nav>
<div class="page-wrap">
  <div class="page-tag">🗓️ Training Planner</div>
  <h1>Workout Split<br><em>Generator</em></h1>
  <p class="sub">Pick your goal, training days, and experience level. Get a complete weekly split with exercises, sets, and reps — ready to execute.</p>

  <div class="setup-card">
    <div class="grid-3">
      <div class="field">
        <label>Training Goal</label>
        <select id="goal">
          <option value="strength">Strength</option>
          <option value="hypertrophy">Hypertrophy / Size</option>
          <option value="athletic">Athletic Performance</option>
          <option value="fatloss">Fat Loss</option>
        </select>
      </div>
      <div class="field">
        <label>Days Per Week</label>
        <select id="days">
          <option value="3">3 Days</option>
          <option value="4">4 Days</option>
          <option value="5" selected>5 Days</option>
          <option value="6">6 Days</option>
        </select>
      </div>
      <div class="field">
        <label>Experience Level</label>
        <select id="level">
          <option value="beginner">Beginner (0–1 yr)</option>
          <option value="intermediate" selected>Intermediate (1–3 yrs)</option>
          <option value="advanced">Advanced (3+ yrs)</option>
        </select>
      </div>
    </div>
    <button class="gen-btn" onclick="generate()">Generate My Split →</button>
  </div>

  <div class="split" id="splitResult">
    <div class="split-header">
      <div class="split-title" id="splitTitle">—</div>
      <div class="split-desc" id="splitDesc">—</div>
    </div>
    <div class="week-grid" id="weekGrid"></div>
    <div class="exercises-list" id="exerciseList"></div>
  </div>
</div>

<script>
var _AF_APP='6a1f3d189ebdbe71fa7d256c';
(function(){
  var p=new URLSearchParams(window.location.search),ut=p.get('access_token');
  if(ut){localStorage.setItem('base44_access_token',ut);localStorage.setItem('token',ut);p.delete('access_token');window.history.replaceState({},'',window.location.pathname+(p.toString()?'?'+p.toString():''));}
  var tok=localStorage.getItem('base44_access_token')||localStorage.getItem('token');
  window._aftok=tok||null;
  if(tok){
    fetch('/api/apps/'+_AF_APP+'/auth/me',{headers:{'Authorization':'Bearer '+tok}})
      .then(function(r){return r.ok?r.json():Promise.reject(r.status);})
      .then(function(u){window._afuser=u;loadSaved();})
      .catch(function(){localStorage.removeItem('base44_access_token');localStorage.removeItem('token');window._aftok=null;});
  }
})();
function _afSave(t,d){if(!window._aftok)return;fetch('/api/apps/'+_AF_APP+'/entities/'+t,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._aftok},body:JSON.stringify(d)}).catch(function(){});}
function _afLoad(t,l,cb){if(!window._aftok)return;fetch('/api/apps/'+_AF_APP+'/entities/'+t+'?limit='+l,{headers:{'Authorization':'Bearer '+window._aftok}}).then(function(r){return r.json();}).then(cb).catch(function(){});}
function loadSaved(){
  _afLoad('WorkoutSplit',1,function(results){
    if(!results||!results.length)return;
    var r=results[0];
    if(r.goal)document.getElementById('goal').value=r.goal;
    if(r.days)document.getElementById('days').value=r.days;
    if(r.level)document.getElementById('level').value=r.level;
    generate();
  });
}

const SPLITS={
  strength:{
    3:{name:'Full Body Strength — 3x/Week',desc:'Hit every major movement pattern three times per week for maximum neural adaptation and strength carryover.',days:['Full Body A','Rest','Full Body B','Rest','Full Body C','Rest','Rest']},
    4:{name:'Upper/Lower Strength — 4x/Week',desc:'Upper/lower split maximises frequency for compound strength while allowing adequate recovery between sessions.',days:['Upper A','Lower A','Rest','Upper B','Lower B','Rest','Rest']},
    5:{name:'Push/Pull/Legs — 5x/Week',desc:'Classic PPL for serious strength gains across all major movement patterns with optimal frequency.',days:['Push','Pull','Legs','Rest','Upper','Rest','Rest']},
    6:{name:'Push/Pull/Legs — 6x/Week',desc:'High-frequency PPL for advanced lifters. Each pattern hit twice per week for maximum strength stimulus.',days:['Push A','Pull A','Legs A','Push B','Pull B','Legs B','Rest']}
  },
  hypertrophy:{
    3:{name:'Full Body Hypertrophy — 3x/Week',desc:'3x per week full-body with higher volume per session. Best for maximising muscle protein synthesis frequency.',days:['Full Body A','Rest','Full Body B','Rest','Full Body C','Rest','Rest']},
    4:{name:'Upper/Lower Hypertrophy — 4x/Week',desc:'Upper/lower with hypertrophy rep ranges. Higher volume than strength splits with more isolation work.',days:['Upper A','Lower A','Rest','Upper B','Lower B','Rest','Rest']},
    5:{name:'Bro Split+ — 5x/Week',desc:'Classic bodybuilder split hitting each muscle with dedicated volume. Add an extra upper day for prioritised muscles.',days:['Chest','Back','Legs','Shoulders','Arms','Rest','Rest']},
    6:{name:'Arnold Split — 6x/Week',desc:'Chest/back and shoulders/arms on alternating days with a dedicated leg day. High volume, high frequency.',days:['Chest+Back','Shoulders+Arms','Legs','Chest+Back','Shoulders+Arms','Legs','Rest']}
  },
  athletic:{
    3:{name:'Athletic Full Body — 3x/Week',desc:'Power, strength, and conditioning in every session. Built for sport transfer and explosive performance.',days:['Power + Strength','Conditioning','Strength + Speed','Rest','Rest','Rest','Rest']},
    4:{name:'Strength + Speed — 4x/Week',desc:'Two strength days and two speed/conditioning days. Maximises athletic output across all energy systems.',days:['Strength A','Speed + Agility','Strength B','Conditioning','Rest','Rest','Rest']},
    5:{name:'Sport Performance — 5x/Week',desc:'Full sport-performance protocol. Strength, power, speed, conditioning, and mobility all addressed weekly.',days:['Power','Strength A','Speed','Strength B','Conditioning','Rest','Rest']},
    6:{name:'Elite Athletic — 6x/Week',desc:'Competition-prep split for serious athletes. Power and strength in the AM, conditioning and skill in PM.',days:['Power + Strength','Speed + Agility','Strength + Conditioning','Power','Speed','Active Recovery','Rest']}
  },
  fatloss:{
    3:{name:'Metabolic Resistance — 3x/Week',desc:'Full body circuits with minimal rest. Maximises caloric burn while preserving muscle mass in a deficit.',days:['Full Body Circuit A','Rest','Full Body Circuit B','Rest','Full Body Circuit C','Rest','Rest']},
    4:{name:'Lift + Cardio — 4x/Week',desc:'Two strength days to preserve muscle, two high-intensity cardio days to maximise the caloric deficit.',days:['Strength A','HIIT','Strength B','LISS Cardio','Rest','Rest','Rest']},
    5:{name:'Metabolic Split — 5x/Week',desc:'Three resistance sessions and two cardio sessions. Keeps metabolism elevated and muscle preserved throughout.',days:['Upper Resistance','HIIT','Lower Resistance','LISS','Full Body Circuit','Rest','Rest']},
    6:{name:'Daily Burn — 6x/Week',desc:'Alternating resistance and cardio every day. Maximum caloric output with active recovery built in.',days:['Resistance A','HIIT','Resistance B','LISS','Resistance C','HIIT','Rest']}
  }
};

const EXERCISES={
  'Full Body A':[{name:'Barbell Back Squat',sets:'4',reps:'5',rest:'3 min'},{name:'Bench Press',sets:'4',reps:'5',rest:'3 min'},{name:'Deadlift',sets:'3',reps:'5',rest:'4 min'},{name:'Overhead Press',sets:'3',reps:'6',rest:'2 min'},{name:'Pull-Ups',sets:'3',reps:'5–8',rest:'2 min'}],
  'Full Body B':[{name:'Front Squat',sets:'4',reps:'5',rest:'3 min'},{name:'Incline Bench Press',sets:'4',reps:'5',rest:'3 min'},{name:'Romanian Deadlift',sets:'3',reps:'6',rest:'3 min'},{name:'Barbell Row',sets:'4',reps:'6',rest:'2 min'},{name:'Dips',sets:'3',reps:'6–8',rest:'2 min'}],
  'Full Body C':[{name:'Box Squat',sets:'4',reps:'5',rest:'3 min'},{name:'Close Grip Bench',sets:'4',reps:'5',rest:'3 min'},{name:'Trap Bar Deadlift',sets:'3',reps:'5',rest:'4 min'},{name:'Arnold Press',sets:'3',reps:'8',rest:'2 min'},{name:'Chin-Ups',sets:'3',reps:'5–8',rest:'2 min'}],
  'Upper A':[{name:'Bench Press',sets:'4',reps:'4–6',rest:'3 min'},{name:'Barbell Row',sets:'4',reps:'4–6',rest:'3 min'},{name:'Overhead Press',sets:'3',reps:'5–8',rest:'2 min'},{name:'Pull-Ups',sets:'3',reps:'6–8',rest:'2 min'},{name:'Tricep Pushdown',sets:'3',reps:'10–12',rest:'90s'}],
  'Upper B':[{name:'Incline DB Press',sets:'4',reps:'6–8',rest:'2 min'},{name:'Cable Row',sets:'4',reps:'8–10',rest:'2 min'},{name:'DB Shoulder Press',sets:'3',reps:'8–10',rest:'2 min'},{name:'Lat Pulldown',sets:'3',reps:'8–10',rest:'90s'},{name:'Barbell Curl',sets:'3',reps:'10–12',rest:'90s'}],
  'Lower A':[{name:'Barbell Squat',sets:'4',reps:'4–6',rest:'3 min'},{name:'Romanian Deadlift',sets:'4',reps:'6–8',rest:'3 min'},{name:'Leg Press',sets:'3',reps:'10–12',rest:'2 min'},{name:'Walking Lunges',sets:'3',reps:'10 ea',rest:'90s'},{name:'Calf Raises',sets:'4',reps:'15–20',rest:'60s'}],
  'Lower B':[{name:'Deadlift',sets:'4',reps:'4–5',rest:'4 min'},{name:'Front Squat',sets:'3',reps:'5–6',rest:'3 min'},{name:'Leg Curl',sets:'3',reps:'10–12',rest:'90s'},{name:'Bulgarian Split Squat',sets:'3',reps:'8 ea',rest:'2 min'},{name:'Seated Calf Raise',sets:'4',reps:'15',rest:'60s'}],
  'Push':[{name:'Barbell Bench Press',sets:'4',reps:'4–6',rest:'3 min'},{name:'Overhead Press',sets:'3',reps:'5–8',rest:'2 min'},{name:'Incline DB Press',sets:'3',reps:'8–10',rest:'2 min'},{name:'Lateral Raises',sets:'4',reps:'15–20',rest:'60s'},{name:'Tricep Pushdown',sets:'3',reps:'12–15',rest:'60s'},{name:'Skull Crushers',sets:'3',reps:'10–12',rest:'60s'}],
  'Pull':[{name:'Deadlift',sets:'4',reps:'4–5',rest:'4 min'},{name:'Pull-Ups',sets:'4',reps:'6–10',rest:'2 min'},{name:'Barbell Row',sets:'3',reps:'6–8',rest:'2 min'},{name:'Face Pulls',sets:'4',reps:'15–20',rest:'60s'},{name:'Hammer Curls',sets:'3',reps:'10–12',rest:'60s'},{name:'Barbell Curl',sets:'3',reps:'10–12',rest:'60s'}],
  'Legs':[{name:'Barbell Squat',sets:'4',reps:'5–8',rest:'3 min'},{name:'Romanian Deadlift',sets:'3',reps:'8–10',rest:'2 min'},{name:'Leg Press',sets:'3',reps:'10–15',rest:'2 min'},{name:'Leg Curl',sets:'3',reps:'10–12',rest:'90s'},{name:'Walking Lunges',sets:'3',reps:'12 ea',rest:'90s'},{name:'Calf Raises',sets:'5',reps:'15–20',rest:'60s'}],
  'Chest':[{name:'Barbell Bench Press',sets:'4',reps:'6–10',rest:'2 min'},{name:'Incline DB Press',sets:'4',reps:'8–12',rest:'2 min'},{name:'Cable Fly',sets:'3',reps:'12–15',rest:'60s'},{name:'Dips',sets:'3',reps:'10–15',rest:'90s'},{name:'DB Pullover',sets:'3',reps:'12',rest:'60s'}],
  'Back':[{name:'Deadlift',sets:'3',reps:'5',rest:'4 min'},{name:'Pull-Ups',sets:'4',reps:'8–12',rest:'2 min'},{name:'Barbell Row',sets:'4',reps:'8–10',rest:'2 min'},{name:'Lat Pulldown',sets:'3',reps:'10–12',rest:'90s'},{name:'Cable Row',sets:'3',reps:'12',rest:'90s'}],
  'Shoulders':[{name:'Overhead Press',sets:'4',reps:'6–8',rest:'2 min'},{name:'DB Shoulder Press',sets:'3',reps:'10–12',rest:'90s'},{name:'Lateral Raises',sets:'5',reps:'15–20',rest:'45s'},{name:'Face Pulls',sets:'4',reps:'15–20',rest:'45s'},{name:'Rear Delt Fly',sets:'3',reps:'15',rest:'45s'}],
  'Arms':[{name:'Barbell Curl',sets:'4',reps:'8–12',rest:'60s'},{name:'Skull Crushers',sets:'4',reps:'8–12',rest:'60s'},{name:'Incline DB Curl',sets:'3',reps:'12',rest:'60s'},{name:'Tricep Pushdown',sets:'3',reps:'12–15',rest:'60s'},{name:'Hammer Curls',sets:'3',reps:'12',rest:'60s'},{name:'Overhead Tricep Ext',sets:'3',reps:'12',rest:'60s'}],
  'Power':[{name:'Power Clean',sets:'5',reps:'3',rest:'3 min'},{name:'Box Jump',sets:'5',reps:'5',rest:'2 min'},{name:'Push Jerk',sets:'4',reps:'3',rest:'3 min'},{name:'Broad Jump',sets:'4',reps:'5',rest:'2 min'},{name:'Med Ball Slam',sets:'4',reps:'8',rest:'90s'}],
  'Conditioning':[{name:'400m Sprint Intervals',sets:'6',reps:'1 lap',rest:'2 min'},{name:'Sled Push',sets:'5',reps:'30m',rest:'90s'},{name:'Battle Ropes',sets:'4',reps:'30s',rest:'60s'},{name:'KB Swings',sets:'4',reps:'20',rest:'60s'},{name:'Burpees',sets:'3',reps:'15',rest:'60s'}],
  'Rest':[],
  'Active Recovery':[]
};

function generate(){
  var goal=document.getElementById('goal').value;
  var days=parseInt(document.getElementById('days').value);
  var level=document.getElementById('level').value;
  var splitData=(SPLITS[goal]||SPLITS.strength)[days]||(SPLITS[goal]||SPLITS.strength)[5];
  document.getElementById('splitTitle').textContent=splitData.name;
  document.getElementById('splitDesc').textContent=splitData.desc+' ('+level.charAt(0).toUpperCase()+level.slice(1)+' programme)';
  var dayNames=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  var wg=document.getElementById('weekGrid');wg.innerHTML='';
  splitData.days.forEach(function(d,i){
    var isRest=d==='Rest'||d==='Active Recovery';
    wg.innerHTML+='<div class="day-col'+(isRest?'':' active')+'">'
      +'<div class="day-header"><div class="day-name">'+dayNames[i]+'</div><div class="day-focus">'+(isRest?'—':d.split(' ')[0])+'</div></div>'
      +'<div class="day-body">'+(isRest?'Rest':'Train')+'</div></div>';
  });
  var el=document.getElementById('exerciseList');el.innerHTML='';
  splitData.days.forEach(function(d,i){
    if(d==='Rest'||d==='Active Recovery')return;
    var exs=EXERCISES[d]||EXERCISES['Full Body A'];
    el.innerHTML+='<div class="ex-card">'
      +'<div class="ex-card-header" onclick="toggleDay(this)">'
      +'<div><div class="ex-day-name">'+dayNames[i]+' — '+d+'</div><div class="ex-day-focus">'+exs.length+' exercises</div></div>'
      +'<span style="color:var(--lime);font-size:.8rem;font-weight:700">+</span></div>'
      +'<div class="ex-card-body">'
      +'<table class="ex-table"><thead><tr><th>Exercise</th><th>Sets</th><th>Reps</th><th>Rest</th></tr></thead><tbody>'
      +exs.map(function(e){return '<tr><td>'+e.name+'</td><td>'+e.sets+'</td><td>'+e.reps+'</td><td>'+e.rest+'</td></tr>';}).join('')
      +'</tbody></table></div></div>';
  });
  document.getElementById('splitResult').classList.add('show');
  document.getElementById('splitResult').scrollIntoView({behavior:'smooth',block:'start'});
  _afSave('WorkoutSplit',{goal:goal,days:days,level:level,splitName:splitData.name,saved_at:new Date().toISOString()});
}

function toggleDay(header){
  var body=header.nextElementSibling;
  var span=header.querySelector('span');
  body.classList.toggle('open');
  span.textContent=body.classList.contains('open')?'−':'+';
}
</script>
</body>
</html>
