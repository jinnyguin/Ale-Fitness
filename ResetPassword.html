<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="/images/alefit-logo.png" rel="icon" type="image/svg+xml"/>
  <title>Reset Password | ALEFIT</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0F0F0F;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
    }
    .logo {
      text-align: center;
      margin-bottom: 36px;
      text-decoration: none;
      display: block;
    }
    .logo h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
    }
    .logo h1 span { color: #D4FF00; }
    .logo p {
      color: #555;
      font-size: 0.8125rem;
      margin-top: 0.25rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
    }
    .field { margin-bottom: 20px; }
    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #D4FF00; }
    input[type="password"]::placeholder { color: rgba(255,255,255,0.3); }
    .rules {
      margin: -8px 0 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      line-height: 1.5;
    }
    button[type="submit"] {
      width: 100%;
      background: #D4FF00;
      color: #0F0F0F;
      border: none;
      border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button[type="submit"]:hover { opacity: 0.88; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }
    .msg.success { background: rgba(212,255,0,0.12); color: #D4FF00; border: 1px solid rgba(212,255,0,0.3); }
    .msg.error   { background: rgba(255,60,60,0.1); color: #ff6b6b; border: 1px solid rgba(255,60,60,0.3); }
    .back {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.4);
    }
    .back a { color: #D4FF00; text-decoration: none; font-weight: 500; }
    .back a:hover { text-decoration: underline; }
    .invalid-state { text-align: center; padding: 24px 0; }
    .invalid-state p { color: rgba(255,255,255,0.5); font-size: 15px; margin-bottom: 20px; }
    .invalid-state a {
      display: inline-block;
      background: #D4FF00;
      color: #0F0F0F;
      border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 13px 28px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="/">
      <img src="/images/alefit-logo.png" alt="AleFit" style="height:52px;width:auto">
      <p>ELITE PERFORMANCE TRAINING</p>
    </a>
    <div id="mainContent"></div>
  </div>

  <script>
    var APP_ID = '6a1f3d189ebdbe71fa7d256c';
    var RECOVERY_VERIFIER_KEY = 'alefit_password_recovery_pkce';

    var hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    var queryParams = new URLSearchParams(window.location.search);
    var token = hashParams.get('access_token') || queryParams.get('access_token') || '';
    var tokenHash = hashParams.get('token_hash') || queryParams.get('token_hash') || '';
    var code = queryParams.get('code') || hashParams.get('code') || '';
    var legacyToken = queryParams.get('token') || '';
    if (!token && !tokenHash && legacyToken) {
      if (legacyToken.split('.').length === 3) token = legacyToken;
      else tokenHash = legacyToken;
    }
    var tokenType = hashParams.get('type') || queryParams.get('type') || '';
    var providerError = hashParams.get('error_code') || hashParams.get('error') ||
      queryParams.get('error_code') || queryParams.get('error') || '';
    var container = document.getElementById('mainContent');

    var recoveryVerifier = '';
    var recoveryVerifierState = null;
    if (code) {
      try {
        recoveryVerifierState = JSON.parse(
          window.localStorage.getItem(RECOVERY_VERIFIER_KEY) || 'null'
        );
        if (
          recoveryVerifierState &&
          typeof recoveryVerifierState.verifier === 'string' &&
          Date.now() - recoveryVerifierState.created < 60 * 60 * 1000 &&
          Date.now() >= recoveryVerifierState.created
        ) {
          recoveryVerifier = recoveryVerifierState.verifier;
        }
      } catch (storageError) {}
    }

    // Recovery credentials are only needed in memory for submission. Remove them
    // from the address bar before loading other resources or navigating away.
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', window.location.pathname);
    }

    var invalidMessage = '';
    if (providerError) {
      invalidMessage = 'This reset link was declined, expired, or already used. Request a new link and try again.';
    } else if (tokenType && tokenType !== 'recovery') {
      invalidMessage = 'This is not a password reset link. Request a new reset link and try again.';
    } else if (code && !recoveryVerifier) {
      invalidMessage = 'This secure link needs the browser where you requested it. Open it there, or request a new reset link in this browser.';
    } else if (!token && !tokenHash && !code) {
      invalidMessage = 'This reset link is invalid, expired, or already used. Request a new link and try again.';
    }

    if (invalidMessage) {
      container.innerHTML = '<h1>RESET LINK UNAVAILABLE</h1>'
        + '<div class="subtitle" id="invalidMessage"></div>'
        + '<div class="invalid-state">'
        + '<p>Your account and saved training plan have not been changed.</p>'
        + '<a href="/ForgotPassword.html">REQUEST A NEW LINK</a>'
        + '</div>';
      container.querySelector('#invalidMessage').textContent = invalidMessage;
    } else {
      container.innerHTML = '<h1>SET NEW PASSWORD</h1>'
        + '<p class="subtitle">Choose a strong password for your ALEFIT account.</p>'
        + '<form id="resetForm">'
        + '<div class="field"><label for="pw">New Password</label>'
        + '<input autocomplete="new-password" id="pw" minlength="8" maxlength="128" placeholder="At least 8 characters" required type="password"/></div>'
        + '<p class="rules">Must be at least 8 characters.</p>'
        + '<div class="field"><label for="pw2">Confirm Password</label>'
        + '<input autocomplete="new-password" id="pw2" minlength="8" maxlength="128" placeholder="Repeat your password" required type="password"/></div>'
        + '<button id="submitBtn" type="submit">SET NEW PASSWORD</button>'
        + '</form>'
        + '<div class="msg" id="msg"></div>'
        + '<div class="back" id="retryLink" style="display:none"><a href="/ForgotPassword.html">REQUEST A NEW LINK</a></div>'
        + '<div class="back"><a href="/Login.html">← Back to Login</a></div>';

      document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var pw  = document.getElementById('pw').value;
        var pw2 = document.getElementById('pw2').value;
        var btn = document.getElementById('submitBtn');
        var msg = document.getElementById('msg');
        msg.style.display = 'none';

        if (pw.length < 8) {
          msg.className = 'msg error';
          msg.textContent = 'Password must be at least 8 characters.';
          msg.style.display = 'block';
          return;
        }
        if (pw.length > 128) {
          msg.className = 'msg error';
          msg.textContent = 'Password must be 128 characters or fewer.';
          msg.style.display = 'block';
          return;
        }
        if (pw !== pw2) {
          msg.className = 'msg error';
          msg.textContent = 'Passwords do not match.';
          msg.style.display = 'block';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'SAVING…';

        try {
          var requestBody = {new_password:pw, type:'recovery'};
          if (token) requestBody.reset_token = token;
          else if (tokenHash) requestBody.token_hash = tokenHash;
          else {
            requestBody.code = code;
            requestBody.code_verifier = recoveryVerifier;
          }
          var res;
          try {
            res = await fetch('/api/apps/' + APP_ID + '/auth/reset-password', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(requestBody)
            });
          } catch (networkError) {
            throw new Error('Could not reach the password recovery service. Check your connection and try again.');
          }
          var data;
          try {
            data = await res.json();
          } catch (parseError) {
            throw new Error('The password recovery service returned an invalid response. Please try again.');
          }
          if (!data || typeof data !== 'object' || Array.isArray(data)) {
            throw new Error('The password recovery service returned an invalid response. Please try again.');
          }
          if (res.ok) {
            try {
              window.localStorage.removeItem(RECOVERY_VERIFIER_KEY);
            } catch (storageError) {}
            msg.className = 'msg success';
            msg.textContent = 'Password updated! Redirecting you to login…';
            msg.style.display = 'block';
            btn.textContent = 'PASSWORD SET ✓';
            setTimeout(function() { window.location.href = '/Login.html'; }, 2000);
          } else {
            if (
              data.code === 'invalid_recovery_link' ||
              data.code === 'recovery_browser_mismatch' ||
              data.code === 'recovery_link_used'
            ) {
              var retryLink = document.getElementById('retryLink');
              if (retryLink) retryLink.style.display = 'block';
              try {
                window.localStorage.removeItem(RECOVERY_VERIFIER_KEY);
              } catch (storageError) {}
            }
            throw new Error(data.error || (res.status >= 500 ?
              'Password recovery is temporarily unavailable. Please try again later.' :
              'Failed to reset password. The link may have expired.'));
          }
        } catch (err) {
          msg.className = 'msg error';
          msg.textContent = err.message || 'Something went wrong. Please try again.';
          msg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SET NEW PASSWORD';
        }
      });
    }
  </script>
</body>
</html>
