<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="/images/c88292ed9_logo.png" rel="icon" type="image/svg+xml"/>
  <title>Reset Password | ALEFIT</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0F0F0F;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
      text-decoration: none;
    }
    .logo img { height: 32px; }
    .logo span {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #fff;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
    }
    .field { margin-bottom: 20px; }
    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus { border-color: #D4FF00; }
    input[type="password"]::placeholder { color: rgba(255,255,255,0.3); }
    .rules {
      margin: -8px 0 20px;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      line-height: 1.5;
    }
    button[type="submit"] {
      width: 100%;
      background: #D4FF00;
      color: #0F0F0F;
      border: none;
      border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button[type="submit"]:hover { opacity: 0.88; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }
    .msg.success { background: rgba(212,255,0,0.12); color: #D4FF00; border: 1px solid rgba(212,255,0,0.3); }
    .msg.error   { background: rgba(255,60,60,0.1); color: #ff6b6b; border: 1px solid rgba(255,60,60,0.3); }
    .back {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.4);
    }
    .back a { color: #D4FF00; text-decoration: none; font-weight: 500; }
    .back a:hover { text-decoration: underline; }
    .invalid-state { text-align: center; padding: 24px 0; }
    .invalid-state p { color: rgba(255,255,255,0.5); font-size: 15px; margin-bottom: 20px; }
    .invalid-state a {
      display: inline-block;
      background: #D4FF00;
      color: #0F0F0F;
      border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 13px 28px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="/">
      <img alt="ALEFIT" src="/images/c88292ed9_logo.png"/>
      <span>ALEFIT</span>
    </a>
    <div id="mainContent"></div>
  </div>

  <script>
    var APP_ID = '6a1f3d189ebdbe71fa7d256c';

    function parseHashParams() {
      var hash = window.location.hash.replace(/^#/, '');
      var params = {};
      hash.split('&').forEach(function(part) {
        var kv = part.split('=');
        if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
      return params;
    }

    function parseQueryParams() {
      var params = {};
      window.location.search.replace(/^\?/, '').split('&').forEach(function(part) {
        var kv = part.split('=');
        if (kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
      });
      return params;
    }

    var hashParams = parseHashParams();
    var queryParams = parseQueryParams();
    var token = hashParams['access_token'] || queryParams['access_token'] || queryParams['token'] || '';
    var tokenType = hashParams['type'] || queryParams['type'] || '';
    var container = document.getElementById('mainContent');

    if (!token || (tokenType && tokenType !== 'recovery')) {
      container.innerHTML = '<h1>INVALID LINK</h1>'
        + '<div class="subtitle">This password reset link is invalid or has expired.</div>'
        + '<div class="invalid-state">'
        + '<p>Request a new reset link and try again.</p>'
        + '<a href="/ForgotPassword.html">GET NEW LINK</a>'
        + '</div>';
    } else {
      container.innerHTML = '<h1>SET NEW PASSWORD</h1>'
        + '<p class="subtitle">Choose a strong password for your ALEFIT account.</p>'
        + '<form id="resetForm">'
        + '<div class="field"><label for="pw">New Password</label>'
        + '<input autocomplete="new-password" id="pw" placeholder="At least 8 characters" required type="password"/></div>'
        + '<p class="rules">Must be at least 8 characters.</p>'
        + '<div class="field"><label for="pw2">Confirm Password</label>'
        + '<input autocomplete="new-password" id="pw2" placeholder="Repeat your password" required type="password"/></div>'
        + '<button id="submitBtn" type="submit">SET NEW PASSWORD</button>'
        + '</form>'
        + '<div class="msg" id="msg"></div>'
        + '<div class="back"><a href="/Login.html">← Back to Login</a></div>';

      document.getElementById('resetForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        var pw  = document.getElementById('pw').value;
        var pw2 = document.getElementById('pw2').value;
        var btn = document.getElementById('submitBtn');
        var msg = document.getElementById('msg');
        msg.style.display = 'none';

        if (pw.length < 8) {
          msg.className = 'msg error';
          msg.textContent = 'Password must be at least 8 characters.';
          msg.style.display = 'block';
          return;
        }
        if (pw !== pw2) {
          msg.className = 'msg error';
          msg.textContent = 'Passwords do not match.';
          msg.style.display = 'block';
          return;
        }

        btn.disabled = true;
        btn.textContent = 'SAVING…';

        try {
          var res = await fetch('/api/apps/' + APP_ID + '/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ reset_token: token, new_password: pw })
          });
          var data = await res.json();
          if (res.ok) {
            msg.className = 'msg success';
            msg.textContent = 'Password updated! Redirecting you to login…';
            msg.style.display = 'block';
            btn.textContent = 'PASSWORD SET ✓';
            setTimeout(function() { window.location.href = '/Login.html'; }, 2000);
          } else {
            msg.className = 'msg error';
            msg.textContent = data.error || 'Failed to reset password. The link may have expired.';
            msg.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'SET NEW PASSWORD';
          }
        } catch (err) {
          msg.className = 'msg error';
          msg.textContent = 'Something went wrong. Please try again.';
          msg.style.display = 'block';
          btn.disabled = false;
          btn.textContent = 'SET NEW PASSWORD';
        }
      });
    }
  </script>
</body>
</html>
