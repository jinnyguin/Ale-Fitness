<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <link href="/images/alefit-logo.png" rel="icon" type="image/svg+xml"/>
  <title>Forgot Password | ALEFIT</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0F0F0F;
      color: #fff;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
    }
    .logo {
      text-align: center;
      margin-bottom: 36px;
      text-decoration: none;
      display: block;
    }
    .logo h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #fff;
    }
    .logo h1 span { color: #D4FF00; }
    .logo p {
      color: #555;
      font-size: 0.8125rem;
      margin-top: 0.25rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    h1 {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 8px;
    }
    .subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
      margin-bottom: 8px;
    }
    input[type="email"] {
      width: 100%;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      padding: 14px 16px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 24px;
    }
    input[type="email"]:focus { border-color: #D4FF00; }
    input[type="email"]::placeholder { color: rgba(255,255,255,0.3); }
    button[type="submit"] {
      width: 100%;
      background: #D4FF00;
      color: #0F0F0F;
      border: none;
      border-radius: 8px;
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 16px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button[type="submit"]:hover { opacity: 0.88; }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }
    .msg.success { background: rgba(212,255,0,0.12); color: #D4FF00; border: 1px solid rgba(212,255,0,0.3); }
    .msg.error   { background: rgba(255,60,60,0.1); color: #ff6b6b; border: 1px solid rgba(255,60,60,0.3); }
    .back {
      margin-top: 24px;
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.4);
    }
    .back a { color: #D4FF00; text-decoration: none; font-weight: 500; }
    .back a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <a class="logo" href="/">
      <img src="/images/alefit-logo.png" alt="AleFit" style="height:52px;width:auto">
      <p>ELITE PERFORMANCE TRAINING</p>
    </a>
    <h1>RESET YOUR PASSWORD</h1>
    <p class="subtitle">Enter your email and we'll send you a link to set a new password.</p>

    <form id="forgotForm">
      <label for="email">Email Address</label>
      <input autocomplete="email" id="email" placeholder="you@example.com" required type="email"/>
      <button id="submitBtn" type="submit">SEND RESET LINK</button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="back">
      <a href="/Login.html">← Back to Login</a>
    </div>
  </div>

  <script>
    var APP_ID = '6a1f3d189ebdbe71fa7d256c';
    document.getElementById('forgotForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      var email = document.getElementById('email').value.trim();
      var btn = document.getElementById('submitBtn');
      var msg = document.getElementById('msg');
      msg.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'SENDING…';
      try {
        var res = await fetch('/api/apps/' + APP_ID + '/auth/reset-password-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        });
        var data = await res.json();
        msg.className = 'msg success';
        msg.textContent = 'If an account with that email exists, a reset link has been sent. Check your inbox.';
        msg.style.display = 'block';
        btn.textContent = 'SENT ✓';
      } catch (err) {
        msg.className = 'msg error';
        msg.textContent = 'Something went wrong. Please try again.';
        msg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'SEND RESET LINK';
      }
    });
  </script>
</body>
</html>
