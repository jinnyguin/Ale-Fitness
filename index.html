  /* Keep the legacy homepage connected to this app's local API routes. */
  (function () {
    var nativeFetch = window.fetch ? window.fetch.bind(window) : null;
    var nativeOpen = XMLHttpRequest.prototype.open;
    function local(url) {
      return typeof url === "string" && url.indexOf("https://base44.app") === 0
        ? url.replace("https://base44.app", "") : url;
    }
    XMLHttpRequest.prototype.open = function (method, url, async, user, password) {
      return nativeOpen.call(this, method, local(url), async !== false, user, password);
    };
    if (nativeFetch) {
      window.fetch = function (url, options) {
        if (typeof url === "string") url = local(url);
        return nativeFetch(url, options);
      };
    }
  }());
  </script>

  <script>
  (function () {
    var wired = new WeakSet();
    function linkTo(el, path) {
      el.setAttribute("href", path);
      if (el.dataset.alefitRouteWired) return;
      el.dataset.alefitRouteWired = "1";
      el.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopImmediatePropagation();
        window.location.assign(path);
      }, true);
    }
    function replaceJoinCopy() {
      var replacements = {
        "Join ALEFIT today and unlock your true potential with expert coaching, state-of-the-art equipment, and a community that drives you forward.":
          "Stop guessing. Get a clear plan built around your goals, your schedule, and measurable progress.",
        "Join ALEFIT today and train with a plan built around your goals, schedule, and progress.":
          "Stop guessing. Get a clear plan built around your goals, your schedule, and measurable progress."
      };
      var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      var node;
      while ((node = walker.nextNode())) {
        var value = (node.nodeValue || "").trim();
        if (replacements[value]) node.nodeValue = replacements[value];
      }
      document.querySelectorAll("a,button").forEach(function (el) {
        var text = (el.textContent || "").trim().toLowerCase();
        if (text.indexOf("start your journey") !== -1) {
          el.textContent = "JOIN ALEFIT  →";
          linkTo(el, "/Register.html");
        }
        if (text === "sign up") {
          el.textContent = "JOIN ALEFIT";
          linkTo(el, "/Register.html");
        }
      });
    }
    function hidePrograms() {
      document.querySelectorAll("section").forEach(function (section) {
        var sectionText = (section.textContent || "").toLowerCase();
        if (sectionText.indexOf("16 expert programs") !== -1 ||
            sectionText.indexOf("per program") !== -1) {
          section.querySelectorAll("div").forEach(function (candidate) {
            var candidateText = (candidate.textContent || "").toLowerCase();
            if (candidateText.indexOf("16") !== -1 &&
                candidateText.indexOf("6 wks") !== -1 &&
                candidateText.indexOf("junk volume") !== -1 &&
                candidate.children.length === 4) {
              candidate.remove();
            }
          });
        }
        if (section.querySelectorAll('a[href*="/programs/"]').length >= 3) {
          section.remove();
        }
      });
      document.querySelectorAll('a[href*="/programs/"]').forEach(function (link) {
        var card = link.closest("article,li");
        (card || link).remove();
      });
      document.querySelectorAll("a,button").forEach(function (el) {
        if (wired.has(el)) return;
        var text = (el.textContent || "").trim().toLowerCase();
        if (el.closest("nav,header") && text === "programs") {
          wired.add(el);
          el.textContent = "My Plan";
          linkTo(el, "/my-plan.html");
        } else if (text === "explore programs" ||
                   (text === "programs" && !el.closest("nav,header"))) {
          (el.closest("article,li") || el).remove();
        } else if (text === "login" || text === "sign in") {
          wired.add(el);
          linkTo(el, "/Login.html");
        } else if (text === "sign up" || text === "signup" || text === "register" ||
                   text.indexOf("join alefit") !== -1) {
          wired.add(el);
          linkTo(el, "/Register.html");
        }
      });
    }
    function simplifyHomepage() {
      var home = document.querySelector("section#home");
      if (!home || !home.parentElement) return;
      var shell = home.parentElement;
      var keptFeatureSection = false;
      Array.prototype.slice.call(shell.children).forEach(function (child) {
        if (child === home || child.tagName === "HEADER" ||
            child.classList.contains("bg-lime")) return;
        if (child.tagName === "SECTION" && !keptFeatureSection) {
          keptFeatureSection = true;
          return;
        }
        child.remove();
      });
      document.querySelectorAll("a,button").forEach(function (el) {
        var text = (el.textContent || "").trim().toLowerCase();
        if (text === "athlete tools" && !el.closest("nav,header")) {
          el.remove();
        }
        if (el.closest("nav") &&
            ["athlete tools", "meal plan", "calories", "shop"].indexOf(text) !== -1) {
          el.remove();
        }
      });
    }
    function hidePulse() {
      var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
      var node;
      while ((node = walker.nextNode())) {
        if (node.nodeValue && node.nodeValue.trim() === "PULSE" && node.parentElement) {
          node.parentElement.style.setProperty("display", "none", "important");
        }
      }
    }
    function enhanceConversion() {
      var home = document.querySelector("section#home");
      if (!home) return;

      var heroCta = Array.prototype.slice.call(home.querySelectorAll("a,button"))
        .find(function (el) {
          return (el.textContent || "").trim().toLowerCase().indexOf("join alefit") !== -1;
        });
      if (heroCta) {
        if ((heroCta.textContent || "").trim() !== "JOIN ALEFIT — START NOW  →") {
          heroCta.textContent = "JOIN ALEFIT — START NOW  →";
        }
        linkTo(heroCta, "/Register.html");
        var actionGroup = heroCta.parentElement;
        var heroContent = actionGroup && actionGroup.parentElement;
        if (heroContent && !heroContent.querySelector("[data-alefit-value-strip]")) {
          var valueStrip = document.createElement("div");
          valueStrip.setAttribute("data-alefit-value-strip", "1");
          valueStrip.style.cssText = "display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:22px;color:rgba(255,255,255,.42);font:700 10px/1.4 Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase";
          ["Goal-driven", "Progressive", "Precision-built"].forEach(function (label, index) {
            var item = document.createElement("span");
            item.textContent = (index ? "◆  " : "") + label;
            item.style.color = index ? "rgba(255,255,255,.42)" : "#d4ff00";
            valueStrip.appendChild(item);
          });
          heroContent.appendChild(valueStrip);
        }
      }

      var feature = Array.prototype.slice.call(document.querySelectorAll("section"))
        .find(function (section) {
          return section !== home &&
            (section.textContent || "").indexOf("Programs Built Around Goals") !== -1;
        });
      if (feature && !feature.querySelector("[data-alefit-join-callout]")) {
        var callout = document.createElement("div");
        callout.setAttribute("data-alefit-join-callout", "1");
        callout.style.cssText = "display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;margin:72px 24px 0;padding:34px 38px;background:#d4ff00;color:#0f0f0f";

        var copy = document.createElement("div");
        var eyebrow = document.createElement("div");
        eyebrow.textContent = "Your next session starts here";
        eyebrow.style.cssText = "font:700 10px/1.4 Arial,sans-serif;letter-spacing:.24em;text-transform:uppercase;opacity:.64;margin-bottom:10px";
        var title = document.createElement("h3");
        title.textContent = "Ready to train with purpose?";
        title.style.cssText = "font:800 clamp(24px,3vw,38px)/.98 Arial,sans-serif;letter-spacing:-.04em;margin:0";
        var description = document.createElement("p");
        description.textContent = "Join ALEFIT and turn your goals into your next workout — no guesswork, no wasted sessions.";
        description.style.cssText = "font:500 15px/1.55 Arial,sans-serif;max-width:560px;margin:14px 0 0;opacity:.72";
        copy.appendChild(eyebrow);
        copy.appendChild(title);
        copy.appendChild(description);

        var calloutCta = document.createElement("a");
        calloutCta.textContent = "JOIN ALEFIT  →";
        calloutCta.href = "/Register.html";
        calloutCta.style.cssText = "display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:1px solid rgba(15,15,15,.7);color:#0f0f0f;font:800 11px/1 Arial,sans-serif;letter-spacing:.16em;text-decoration:none;text-transform:uppercase;white-space:nowrap";
        linkTo(calloutCta, "/Register.html");
        callout.appendChild(copy);
        callout.appendChild(calloutCta);
        feature.appendChild(callout);
      }
    }
    function run() { replaceJoinCopy(); hidePrograms(); hidePulse(); simplifyHomepage(); enhanceConversion(); }
    new MutationObserver(run).observe(document.documentElement, {childList:true, subtree:true});
    run();
  }());
  </script>
