      document.querySelectorAll("section").forEach(function (section) {
        var sectionText = (section.textContent || "").toLowerCase();

            var candidateText = (candidate.textContent || "").toLowerCase();
            if (candidateText.indexOf("16") !== -1 &&
                candidateText.indexOf("6 wks") !== -1 &&
                candidateText.indexOf("junk volume") !== -1 &&
                candidate.children.length === 4) {
              candidate.remove();
            }

        if (section.querySelectorAll('a[href*="/programs/"]').length >= 3) {
          section.remove();

      document.querySelectorAll('a[href*="/programs/"]').forEach(function (link) {

          wired.add(el);
