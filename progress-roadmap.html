<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Progress Roadmap — ALEFIT</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--lime:#D4FF00;--dark:#0F0F0F;--card:#141414;--border:rgba(255,255,255,.08)}
body{background:var(--dark);color:#fff;font-family:'Inter',sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}

nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2.5rem;border-bottom:1px solid var(--border)}
.logo{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.5rem;letter-spacing:.18em}
.logo span{color:var(--lime)}
.back{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.4);transition:color .2s}
.back:hover{color:var(--lime)}

.page-wrap{max-width:960px;margin:0 auto;padding:4rem 2.5rem 6rem}
.page-tag{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem .9rem;border:1px solid rgba(212,255,0,.3);color:var(--lime);font-size:.65rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;margin-bottom:1.5rem}
h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(3rem,6vw,5rem);text-transform:uppercase;line-height:.92;margin-bottom:1rem}
h1 em{color:var(--lime);font-style:normal}
.sub{color:rgba(255,255,255,.4);font-size:.9rem;line-height:1.6;font-weight:300;max-width:520px;margin-bottom:3rem}

/* SETUP */
.setup-card{background:var(--card);border:1px solid var(--border);padding:2rem;margin-bottom:3rem}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-bottom:1.5rem}
.field{display:flex;flex-direction:column;gap:.5rem}
.field label{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);font-weight:600}
.field select,.field input[type=date]{background:#0a0a0a;border:1px solid rgba(255,255,255,.1);color:#fff;padding:.8rem 1rem;font-size:.9rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;-webkit-appearance:none;appearance:none;width:100%}
.field select:focus,.field input:focus{border-color:rgba(212,255,0,.4)}
.field select option{background:#111}
.gen-btn{width:100%;background:var(--lime);color:#000;padding:1rem;font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1rem;letter-spacing:.15em;text-transform:uppercase;border:none;cursor:pointer;transition:opacity .2s}
.gen-btn:hover{opacity:.88}

/* ROADMAP */
.roadmap{display:none}.roadmap.show{display:block}

/* HEADER STATS */
.roadmap-header{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);margin-bottom:3rem;border:1px solid var(--border)}
.stat-box{background:var(--card);padding:1.5rem;text-align:center}
.stat-box-val{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:2.5rem;color:var(--lime);line-height:1}
.stat-box-label{font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.3);margin-top:.3rem}

/* TIMELINE */
.timeline-wrap{position:relative;padding-bottom:3rem}
.timeline-label{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:.85rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:2.5rem}
.timeline{position:relative}
.timeline::before{content:'';position:absolute;left:80px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,rgba(212,255,0,.4),rgba(212,255,0,.1) 80%,transparent)}
.milestone{display:flex;gap:0;margin-bottom:2.5rem;position:relative}
.milestone:last-child{margin-bottom:0}
.ms-week{width:80px;flex-shrink:0;text-align:center;padding-top:.25rem}
.ms-week-num{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.4rem;color:rgba(255,255,255,.25);line-height:1}
.ms-week-label{font-size:.55rem;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.2)}
.ms-dot-wrap{flex-shrink:0;width:1px;position:relative;margin-right:2rem}
.ms-dot{position:absolute;left:50%;transform:translateX(-50%);top:6px;width:14px;height:14px;border-radius:50%;border:2px solid;background:var(--dark);transition:all .3s}
.milestone.reached .ms-dot{background:var(--lime);border-color:var(--lime);box-shadow:0 0 12px rgba(212,255,0,.4)}
.milestone.next .ms-dot{border-color:rgba(212,255,0,.5);background:rgba(212,255,0,.1)}
.milestone.future .ms-dot{border-color:rgba(255,255,255,.15);background:var(--dark)}
.ms-content{flex:1;background:var(--card);border:1px solid var(--border);padding:1.5rem;transition:border-color .3s}
.milestone.reached .ms-content{border-color:rgba(212,255,0,.2)}
.milestone.next .ms-content{border-color:rgba(212,255,0,.1)}
.ms-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1rem}
.ms-title{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.2rem;text-transform:uppercase;letter-spacing:.06em}
.ms-date{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.25)}
.ms-date.reached{color:var(--lime)}
.ms-gains{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.gain-chip{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .75rem;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:.72rem;font-weight:500}
.gain-chip .arrow{color:var(--lime);font-weight:700}
.milestone.reached .gain-chip{background:rgba(212,255,0,.06);border-color:rgba(212,255,0,.15)}
.ms-desc{font-size:.8rem;color:rgba(255,255,255,.35);line-height:1.6}
.ms-badge{display:inline-flex;align-items:center;gap:.3rem;background:var(--lime);color:#000;font-size:.6rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.2rem .6rem;margin-top:.75rem}
.ms-badge.upcoming{background:transparent;color:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.12)}

/* PROJECTION CHARTS */
.charts-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:3rem}
.chart-card{background:var(--card);border:1px solid var(--border);padding:1.5rem}
.chart-title{font-size:.62rem;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.3);font-weight:600;margin-bottom:1.25rem}
.chart-bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-bottom:.75rem}
.bar{flex:1;border-radius:2px 2px 0 0;min-height:4px;position:relative;cursor:default}
.bar:hover::after{content:attr(data-val);position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:.6rem;color:#fff;white-space:nowrap;font-weight:600}
.chart-weeks{display:flex;gap:6px}
.chart-weeks span{flex:1;text-align:center;font-size:.55rem;color:rgba(255,255,255,.2);letter-spacing:.06em;text-transform:uppercase}
.chart-final{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:1.8rem;color:var(--lime);margin-top:.5rem}
.chart-final-label{font-size:.62rem;color:rgba(255,255,255,.3);letter-spacing:.08em;text-transform:uppercase}

/* PRINT / SHARE */
.actions-row{display:flex;gap:1rem;margin-top:2.5rem}
.act-btn{padding:.7rem 1.5rem;font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;border:none;transition:all .2s}
.act-primary{background:var(--lime);color:#000}
.act-primary:hover{opacity:.88}
.act-ghost{background:transparent;color:rgba(255,255,255,.4);border:1px solid var(--border)}
.act-ghost:hover{border-color:rgba(255,255,255,.35);color:#fff}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">ALE<span>FIT</span></a>
  <a href="/#tools" class="back">← Back to Site</a>
</nav>

<div class="page-wrap">
  <div class="page-tag">🗺️ Visual Timeline</div>
  <h1>Progress<br><em>Roadmap</em></h1>
  <p class="sub">Select your program and start date. See exactly what gains to expect at each milestone — week by week, prediction by prediction.</p>

  <div class="setup-card">
    <div class="setup-grid">
      <div class="field">
        <label>Your Program</label>
        <select id="programSel">
          <option value="football">Football — 12 Weeks</option>
          <option value="basketball">Basketball — 10 Weeks</option>
          <option value="soccer">Soccer — 10 Weeks</option>
          <option value="strength">Strength Training — 8 Weeks</option>
          <option value="weightloss">Weight Loss — 12 Weeks</option>
          <option value="weightgain">Weight Gain / Hypertrophy — 10 Weeks</option>
          <option value="crossfit">CrossFit — 8 Weeks</option>
          <option value="hiit">HIIT — 8 Weeks</option>
          <option value="pilates">Pilates — 8 Weeks</option>
          <option value="track">Track & Field — 10 Weeks</option>
          <option value="crosscountry">Cross Country — 12 Weeks</option>
          <option value="baseball">Baseball — 10 Weeks</option>
          <option value="tennis">Tennis — 8 Weeks</option>
        </select>
      </div>
      <div class="field">
        <label>Start Date</label>
        <input type="date" id="startDate">
      </div>
    </div>
    <button class="gen-btn" onclick="generate()">Generate My Roadmap →</button>
  </div>

  <div class="roadmap" id="roadmap">
    <div class="roadmap-header" id="headerStats"></div>
    <div class="timeline-label">— Your Week-by-Week Journey</div>
    <div class="timeline" id="timeline"></div>
    <div class="charts-row" id="chartsRow"></div>
    <div class="actions-row">
      <button class="act-btn act-primary" onclick="window.print()">Print Roadmap</button>
      <button class="act-btn act-ghost" onclick="generate()">Regenerate</button>
    </div>
  </div>
</div>

<script>
// ── AUTH GATE & SAVE/LOAD ─────────────────────────────────────────────────
var _AF_APP='6a1f3d189ebdbe71fa7d256c';
(function(){
  var p=new URLSearchParams(window.location.search),ut=p.get('access_token');
  if(ut){localStorage.setItem('base44_access_token',ut);localStorage.setItem('token',ut);p.delete('access_token');window.history.replaceState({},'',window.location.pathname+(p.toString()?'?'+p.toString():''));}
  var tok=localStorage.getItem('base44_access_token')||localStorage.getItem('token');
  if(!tok){window.location.replace('/Login.html?from_url='+encodeURIComponent(window.location.href));return;}
  window._aftok=tok;
  fetch('/api/apps/'+_AF_APP+'/auth/me',{headers:{'Authorization':'Bearer '+tok}})
    .then(function(r){return r.ok?r.json():Promise.reject(r.status);})
    .then(function(u){window._afuser=u;loadSaved();})
    .catch(function(){localStorage.removeItem('base44_access_token');localStorage.removeItem('token');window.location.replace('/Login.html?from_url='+encodeURIComponent(window.location.href));});
})();
function _afSave(type,data){if(!window._aftok)return;fetch('/api/apps/'+_AF_APP+'/entities/'+type,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+window._aftok},body:JSON.stringify(data)}).catch(function(){});}
function _afLoad(type,limit,cb){if(!window._aftok)return;fetch('/api/apps/'+_AF_APP+'/entities/'+type+'?limit='+limit,{headers:{'Authorization':'Bearer '+window._aftok}}).then(function(r){return r.json();}).then(cb).catch(function(){});}
function loadSaved(){
  _afLoad('ProgressRoadmap',1,function(results){
    if(!results||!results.length)return;
    var r=results[0];
    if(r.program){var sel=document.getElementById('programSel');if(sel)sel.value=r.program;}
    if(r.startDate){var sd=document.getElementById('startDate');if(sd)sd.value=r.startDate;}
    generate();
  });
}
// ─────────────────────────────────────────────────────────────────────────────

// Set default date to today
document.getElementById('startDate').valueAsDate = new Date();

const PROGRAMS = {
  football:{name:'Football',weeks:12,color:'#FF6B35',icon:'🏈',milestones:[
    {w:2,title:'Foundation Built',desc:'Baseline strength established. Hip hinge mechanics dialed in. Conditioning baseline recorded.',gains:[{label:'Strength',val:'+5%'},{label:'Form',val:'Locked In'}]},
    {w:4,title:'Explosive Power Emerging',desc:'First measurable gains in vertical jump and sprint speed. Increased hip drive in all movements.',gains:[{label:'Power',val:'+12%'},{label:'Sprint',val:'-0.15s'}]},
    {w:6,title:'Collision Resistance Up',desc:'Upper body mass increases. Core stability dramatically improved. Contact readiness measurable.',gains:[{label:'Upper Strength',val:'+18%'},{label:'Core',val:'+25%'}]},
    {w:8,title:'Peak Conditioning Window',desc:'Max conditioning levels hit. Sprint times at seasonal best. Reactive speed testing optimal.',gains:[{label:'Speed',val:'+8%'},{label:'Endurance',val:'+30%'}]},
    {w:10,title:'Sport Transfer Phase',desc:'Strength translates to on-field performance. Cut speed, first-step quickness, and press strength peak.',gains:[{label:'Agility',val:'+15%'},{label:'1RM',val:'+22%'}]},
    {w:12,title:'Peak Performance',desc:'You\'ve completed the full program. All metrics at their highest. Ready for competition or next cycle.',gains:[{label:'Overall',val:'+28%'},{label:'Body Comp',val:'Improved'}]},
  ],projections:{strength:[10,22,38,50,62,75,85,90,95,100,105,110],endurance:[5,12,22,35,48,58,65,70,75,80,85,90],speed:[3,8,14,22,30,38,45,50,55,60,65,70]}},

  strength:{name:'Strength Training',weeks:8,color:'#D4FF00',icon:'🏋️',milestones:[
    {w:2,title:'Neural Adaptation',desc:'Your nervous system is learning to recruit more muscle fibers. Strength gains come fast even without visible muscle growth.',gains:[{label:'Strength',val:'+8%'},{label:'Technique',val:'Dialed'}]},
    {w:4,title:'Hypertrophy Onset',desc:'Muscle protein synthesis in full swing. Noticeable size gains begin. Weights moving smoothly.',gains:[{label:'1RM',val:'+15%'},{label:'Muscle Size',val:'+5%'}]},
    {w:6,title:'Strength Breakthrough',desc:'First major PRs expected this week. Compound lifts reaching new territory. Body composition shifting.',gains:[{label:'1RM',val:'+22%'},{label:'Body Comp',val:'-3% Fat'}]},
    {w:8,title:'Peak Strength Cycle',desc:'Program complete. All compound lifts at highest recorded levels. Foundation for next training block established.',gains:[{label:'Total Strength',val:'+30%'},{label:'Mass',val:'+4–6 lbs'}]},
  ],projections:{strength:[12,28,42,55,65,78,88,100],endurance:[5,10,15,20,24,28,32,38],muscle:[3,8,15,22,28,35,40,48]}},

  weightloss:{name:'Weight Loss',weeks:12,color:'#FF4444',icon:'🔥',milestones:[
    {w:2,title:'Metabolism Shift',desc:'Water weight dropping. Body adapting to caloric deficit. Energy systems recalibrating.',gains:[{label:'Scale',val:'-3–5 lbs'},{label:'Energy',val:'Stabilizing'}]},
    {w:4,title:'Fat Loss Confirmed',desc:'Real fat loss visible. Cardio endurance significantly improved. Inflammation reducing.',gains:[{label:'Body Fat',val:'-2%'},{label:'Cardio',val:'+25%'}]},
    {w:6,title:'Momentum Phase',desc:'Body in full fat-burning mode. Visible changes in waist and face. Strength maintained despite deficit.',gains:[{label:'Weight',val:'-8–12 lbs'},{label:'Definition',val:'Visible'}]},
    {w:8,title:'Visible Transformation',desc:'Clothes fitting differently. Significant definition in abs and arms. Cardiovascular fitness dramatically improved.',gains:[{label:'Body Fat',val:'-5%'},{label:'Endurance',val:'+40%'}]},
    {w:10,title:'Sustaining Results',desc:'Body adapting to new set point. Focus shifts to maintaining muscle while continuing fat loss.',gains:[{label:'Composition',val:'Transformed'},{label:'Habits',val:'Locked'}]},
    {w:12,title:'Goal Achieved',desc:'Full program complete. Body composition dramatically improved. New lifestyle habits established.',gains:[{label:'Total Weight',val:'-15–25 lbs'},{label:'Body Fat',val:'-6–8%'}]},
  ],projections:{fatLoss:[2,5,9,14,19,24,30,36,42,48,54,60],cardio:[8,18,30,42,52,62,70,78,84,90,95,100],strength:[5,10,14,18,22,26,28,30,32,34,36,38]}},

  crossfit:{name:'CrossFit',weeks:8,color:'#FF6B35',icon:'💥',milestones:[
    {w:2,title:'Movement Patterns Set',desc:'Olympic lift mechanics improving. Gymnastics skill foundation laid. Conditioning baseline established.',gains:[{label:'Technique',val:'Improving'},{label:'Metcon',val:'Baseline'}]},
    {w:4,title:'Work Capacity Exploding',desc:'WOD times dropping significantly. Cardiovascular and muscular endurance combining powerfully.',gains:[{label:'Work Cap',val:'+20%'},{label:'WOD Times',val:'-15%'}]},
    {w:6,title:'Strength + Skill Peak',desc:'Heavy lifts and gymnastics skills combining. The CrossFit effect fully realized.',gains:[{label:'Strength',val:'+18%'},{label:'Skills',val:'Unlocked'}]},
    {w:8,title:'Elite Conditioning',desc:'Program complete. Total work capacity, strength, and skills at program peak.',gains:[{label:'Overall Fitness',val:'+35%'},{label:'Body Comp',val:'Transformed'}]},
  ],projections:{workCapacity:[15,32,48,60,70,80,88,100],strength:[10,22,34,45,55,65,75,85],skills:[5,15,30,45,58,70,80,90]}},

  basketball:{name:'Basketball',weeks:10,color:'#FF9500',icon:'🏀',milestones:[
    {w:2,title:'Athleticism Foundation',desc:'Single-leg stability and reactive speed baseline established. Conditioning protocols underway.',gains:[{label:'Balance',val:'+15%'},{label:'Conditioning',val:'Baseline'}]},
    {w:4,title:'Vertical Jump Gains',desc:'First measurable vertical jump improvements. Lateral quickness drills paying off.',gains:[{label:'Vertical',val:'+2 inches'},{label:'Lateral',val:'+10%'}]},
    {w:6,title:'Court Speed Peak',desc:'First-step speed reaching new levels. Change of direction measurably faster.',gains:[{label:'First Step',val:'+12%'},{label:'Agility',val:'+18%'}]},
    {w:8,title:'Strength Transfers to Court',desc:'Upper body strength translating to post play and contact. Stamina for full-game endurance built.',gains:[{label:'Strength',val:'+20%'},{label:'Stamina',val:'+35%'}]},
    {w:10,title:'Season Ready',desc:'Peak basketball athleticism achieved. All attributes at program high.',gains:[{label:'Vertical',val:'+4 inches'},{label:'Total Athleticism',val:'+28%'}]},
  ],projections:{vertical:[4,10,18,26,34,42,50,58,68,80],agility:[6,14,24,34,44,54,64,72,82,95],endurance:[8,18,30,42,54,64,74,82,90,100]}},
};

// Default to football for missing programs
['soccer','pilates','track','crosscountry','baseball','tennis','weightgain','hiit'].forEach(k=>{
  if(!PROGRAMS[k]) PROGRAMS[k]={...PROGRAMS.football,name:k.charAt(0).toUpperCase()+k.slice(1)};
});

function addWeeks(dateStr,weeks){
  const d=new Date(dateStr);d.setDate(d.getDate()+weeks*7);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
}

function generate(){
  const progKey=document.getElementById('programSel').value;
  const startDateStr=document.getElementById('startDate').value;
  if(!startDateStr){alert('Please select a start date.');return;}
  const prog=PROGRAMS[progKey]||PROGRAMS.football;
  const startDate=new Date(startDateStr);
  const endDate=new Date(startDateStr);
  endDate.setDate(endDate.getDate()+prog.weeks*7);
  const today=new Date();
  const weeksIn=Math.max(0,Math.floor((today-startDate)/(1000*60*60*24*7)));

  // Header stats
  const hs=document.getElementById('headerStats');
  hs.innerHTML=`
    <div class="stat-box"><div class="stat-box-val">${prog.weeks}</div><div class="stat-box-label">Total Weeks</div></div>
    <div class="stat-box"><div class="stat-box-val">${prog.milestones.length}</div><div class="stat-box-label">Milestones</div></div>
    <div class="stat-box"><div class="stat-box-val">${Math.max(0,prog.weeks-weeksIn)}</div><div class="stat-box-label">Weeks Remaining</div></div>
    <div class="stat-box"><div class="stat-box-val">${endDate.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div><div class="stat-box-label">Completion Date</div></div>
  `;

  // Timeline
  const tl=document.getElementById('timeline');tl.innerHTML='';
  prog.milestones.forEach(ms=>{
    const isReached=weeksIn>=ms.w;
    const isNext=!isReached&&prog.milestones.filter(m=>m.w<=weeksIn).length===prog.milestones.indexOf(ms);
    const cls=isReached?'reached':isNext?'next':'future';
    const msDate=addWeeks(startDateStr,ms.w);
    const badge=isReached?`<div class="ms-badge">✓ Milestone Reached</div>`:isNext?`<div class="ms-badge upcoming">⟶ Upcoming</div>`:`<div class="ms-badge upcoming">Locked</div>`;
    tl.innerHTML+=`<div class="milestone ${cls}">
      <div class="ms-week"><div class="ms-week-num">${ms.w}</div><div class="ms-week-label">Wk</div></div>
      <div class="ms-dot-wrap"><div class="ms-dot"></div></div>
      <div class="ms-content">
        <div class="ms-top"><div class="ms-title">${ms.title}</div><div class="ms-date ${isReached?'reached':''}">${msDate}</div></div>
        <div class="ms-gains">${ms.gains.map(g=>`<div class="gain-chip"><span class="arrow">↑</span>${g.label}: <strong>${g.val}</strong></div>`).join('')}</div>
        <div class="ms-desc">${ms.desc}</div>
        ${badge}
      </div>
    </div>`;
  });

  // Charts
  const cr=document.getElementById('chartsRow');cr.innerHTML='';
  const projKeys=Object.keys(prog.projections);
  const projLabels={'strength':'Strength','endurance':'Endurance','speed':'Speed','fatLoss':'Fat Loss','cardio':'Cardio','muscle':'Muscle','workCapacity':'Work Capacity','skills':'Skills','vertical':'Vertical Jump','agility':'Agility'};
  projKeys.forEach(key=>{
    const data=prog.projections[key];
    const maxVal=Math.max(...data);
    const finalVal=data[data.length-1];
    const bars=data.map((v,i)=>{
      const h=Math.round((v/maxVal)*70)+10;
      const isReached=i<weeksIn;
      const bg=isReached?`background:${prog.color}`:`background:rgba(255,255,255,0.1)`;
      return `<div class="bar" style="height:${h}px;${bg}" data-val="Wk${i+1}: ${v}%"></div>`;
    }).join('');
    const weekLabels=data.map((_,i)=>`<span>${i+1}</span>`).join('');
    cr.innerHTML+=`<div class="chart-card">
      <div class="chart-title">${projLabels[key]||key} Projection</div>
      <div class="chart-bars">${bars}</div>
      <div class="chart-weeks">${weekLabels}</div>
      <div class="chart-final">+${finalVal}%</div>
      <div class="chart-final-label">Projected Gain at Week ${prog.weeks}</div>
    </div>`;
  });

  document.getElementById('roadmap').classList.add('show');
  document.getElementById('roadmap').scrollIntoView({behavior:'smooth',block:'start'});
  _afSave('ProgressRoadmap',{program:progKey,startDate:startDateStr,saved_at:new Date().toISOString()});
}
</script>
</body>
</html>
