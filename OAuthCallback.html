<!DOCTYPE html>
<html lang="en">
<head>
  <script src="/auth-session.js"></script>
  <script src="/member-routing.js"></script>
  <meta name="referrer" content="no-referrer"/>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signing in… | ALEFIT</title>
  <link rel="icon" href="/images/alefit-logo.png" type="image/png"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: 24px;
      font-family: 'DM Sans', 'Segoe UI', system-ui, sans-serif;
      color: #f4f5ef;
      background:
        radial-gradient(ellipse at 50% 34%, rgba(174, 207, 0, .09), transparent 42%),
        #080a08;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(100%, 420px);
      padding: 36px 28px 32px;
      border: 1px solid rgba(212, 255, 0, .13);
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(19, 23, 18, .97), rgba(12, 14, 12, .98));
      box-shadow: 0 28px 90px rgba(0, 0, 0, .42), 0 0 52px rgba(174, 207, 0, .04);
      text-align: center;
      color: #a4a99e;
    }
    .brand {
      display: block;
      width: 112px;
      height: auto;
      margin: 0 auto 32px;
    }
    .spinner {
      position: relative;
      width: 54px;
      height: 54px;
      border: 2px solid rgba(212, 255, 0, .15);
      border-top-color: #d4ff00;
      border-right-color: rgba(212, 255, 0, .55);
      border-radius: 50%;
      animation: spin .9s linear infinite;
      margin: 0 auto 22px;
      box-shadow: 0 0 24px rgba(212, 255, 0, .09);
    }
    .spinner::after {
      content: "";
      position: absolute;
      inset: 17px;
      border-radius: 50%;
      background: #d4ff00;
      box-shadow: 0 0 16px rgba(212, 255, 0, .48);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 {
      color: #f4f5ef;
      font-size: clamp(1.25rem, 5vw, 1.5rem);
      line-height: 1.15;
      letter-spacing: .04em;
      text-transform: uppercase;
      margin: 0 0 9px;
    }
    #sub { margin: 0; font-size: .9rem; line-height: 1.5; }
    .error { color: #ffb4a9; margin-top: 18px; font-size: .9rem; line-height: 1.55; }
    a { color: #d4ff00; text-underline-offset: 3px; }
    a:focus-visible { outline: 2px solid #d4ff00; outline-offset: 4px; border-radius: 3px; }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { padding: 32px 22px 28px; }
      .brand { margin-bottom: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
    }
  </style>
</head>
<body>
<main class="card" role="status" aria-live="polite" aria-busy="true">
  <img class="brand" src="/images/alefit-logo.png" alt="ALEFIT"/>
  <div class="spinner" id="spinner" aria-hidden="true"></div>
  <h2 id="heading">Completing sign-in…</h2>
  <p id="sub">Please wait a moment.</p>
  <p class="error" id="errMsg" style="display:none"></p>
</main>
<script>
(async function() {
  var APP_ID = '6a1f3d189ebdbe71fa7d256c';
  var query = new URLSearchParams(window.location.search);
  function safeReturnPath(raw) {
    try {
      var target = new URL(raw || '/Login.html', window.location.origin);
      if (target.origin !== window.location.origin) return '/Login.html';
      return target.pathname + target.search + target.hash;
    } catch (e) {
      return '/Login.html';
    }
  }
  var fromUrl = safeReturnPath(query.get('from_url'));
  if (/^\/(?:auth\/callback|OAuthCallback\.html)/i.test(fromUrl)) fromUrl = '/Login.html';

  function setError(msg) {
    document.querySelector('.card').setAttribute('aria-busy', 'false');
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('heading').textContent = 'Sign-in failed';
    document.getElementById('sub').textContent = '';
    var e = document.getElementById('errMsg');
    e.textContent = msg + ' — ';
    var a = document.createElement('a');
    a.href = fromUrl;
    a.textContent = 'Return to ALEFIT';
    e.appendChild(a);
    e.style.display = 'block';
  }

  // Read access_token from URL hash (#access_token=...&token_type=bearer...)
  var hash = window.location.hash.substring(1);
  var params = new URLSearchParams(hash);
  var token = params.get('access_token');
  var refreshToken = params.get('refresh_token');
  // Remove credentials before any navigation or subsequent resource request.
  if (window.history) window.history.replaceState(null, '', '/auth/callback');
  var providerError = params.get('error_description') || params.get('error') ||
    query.get('error_description') || query.get('error');
  if (providerError) {
    setError(/access_denied|cancel/i.test(providerError) ?
      'Google sign-in was cancelled. Your saved plan has not changed.' :
      'Google could not complete sign-in. Please try again or use email sign-in.');
    return;
  }
  if (query.get('code')) {
    try {
      var pending = JSON.parse(window.sessionStorage.getItem('alefit_oauth_pending') || 'null');
      if (!pending || Date.now() - pending.started > 20 * 60 * 1000) {
        throw new Error('Sign-in expired or opened in a different browser. Return to ALEFIT and try again.');
      }
      var session = await window.AlefitSession.exchange({
        code:query.get('code'), code_verifier:pending.verifier
      });
      token = session.access_token;
      refreshToken = session.refresh_token;
      fromUrl = safeReturnPath(pending.returnTo);
      window.sessionStorage.removeItem('alefit_oauth_pending');
    } catch (error) { setError(error.message); return; }
  }

  // Also check query string (some providers use ?access_token=)
  if (!token) {
    var qp = new URLSearchParams(window.location.search);
    token = qp.get('access_token');
  }

  if (!token) {
    setError(query.get('error_description') || query.get('error') || 'No access token received.');
    return;
  }

  function clearStoredSession() {
    try {
      window.localStorage.removeItem('base44_access_token');
      window.localStorage.removeItem('token');
      window.localStorage.removeItem('alefit_user');
    } catch (e) {}
  }

  try {
    window.AlefitSession.save({access_token:token, refresh_token:refreshToken});
  } catch (storageError) {
    clearStoredSession();
    setError('Your browser blocked sign-in storage. Allow site data for ALEFIT, then try again.');
    return;
  }

  // Confirm the provider token before sending the user into a signed-in page.
  window.AlefitSession.timedFetch('/api/apps/' + APP_ID + '/auth/me', {
    headers: { 'Authorization': 'Bearer ' + token }
  }).then(function(response) {
    return response.json().catch(function() { return null; }).then(function(user) {
      if (
        !response.ok ||
        !user ||
        typeof user !== 'object' ||
        Array.isArray(user) ||
        typeof user.id !== 'string' ||
        !user.id.trim()
      ) {
        var error = new Error(response.status === 429 ?
          'Sign-in verification is busy. Please return and try again in a moment.' :
          response.status >= 500 ?
            'Sign-in is temporarily unavailable. Please return and try again in a moment.' :
            'Google sign-in could not be verified. Please try signing in again.');
        error.clearSession = response.status === 401 || response.status === 403;
        throw error;
      }
      return user;
    });
  }).then(function(user) {
    if (window.AlefitMember) window.AlefitMember.markSignedIn(user);
    try {
      window.localStorage.setItem('alefit_user', JSON.stringify(user));
    } catch (storageError) {
      clearStoredSession();
      throw new Error('Your browser blocked sign-in storage. Allow site data for ALEFIT, then try again.');
    }
    var dest = new URL(fromUrl, window.location.origin);
    dest.searchParams.delete('access_token');
    window.location.replace(dest.toString());
  }).catch(function(error) {
    if (error && error.clearSession) clearStoredSession();
    var message = error && error.name === 'TypeError' ?
      'Could not reach the sign-in service. Check your connection and try again.' :
      (error && error.message) || 'Google sign-in could not be completed. Please try again.';
    setError(message);
  });
})();
</script>
</body>
</html>
